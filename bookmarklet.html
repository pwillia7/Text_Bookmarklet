            button.type = 'button';
            button.className = 'text-btn';
            if (hint) button.title = hint;
            button.appendChild(createIcon(iconPaths));
            button.appendChild(document.createTextNode(label));
            return button;
        }

        function savePaneContent() {
            var allPanes = entryContent.querySelectorAll('.entry-pane');
            allPanes.forEach(pane => {
                var entryId = pane.dataset.entryId;
                var contentDiv = pane.querySelector('div[contenteditable="true"]');
                if (contentDiv && entryId !== undefined) {
                    var entryIndex = entries.findIndex(entry => entry.id.toString() === entryId);
                    if (entryIndex !== -1) {
                        var clone = contentDiv.cloneNode(true);
                        clone.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                            var textNode = document.createTextNode(checkbox.checked ? '[x]' : '[ ]');
                            checkbox.parentNode.replaceChild(textNode, checkbox);
                        });
                        entries[entryIndex].content = clone.innerHTML;
                        updateEntryPreview(entries[entryIndex]);
                    }
                }
            });
            saveEntries();
        }

        function saveEntries() {
            entryContentStorage.value = JSON.stringify(entries);
            persistEntries();
        }

        var HASH_PREFIX = 'n1.';
        var WINDOW_NAME_PREFIX = 'text-bookmarklet:';
        var HASH_PERSIST_DELAY = 500;
        var hashPersistTimer = null;

        function bytesToBase64Url(bytes) {
            var binary = '';
            for (var i = 0; i < bytes.length; i += 0x8000) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
            }
            return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        function base64UrlToBytes(str) {
            var binary = atob(str.replace(/-/g, '+').replace(/_/g, '/'));
            var bytes = new Uint8Array(binary.length);
            for (var i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes;
        }

        function compressText(text) {
            var stream = new Blob([text]).stream().pipeThrough(new CompressionStream('deflate-raw'));
            return new Response(stream).arrayBuffer().then(function(buffer) {
                return bytesToBase64Url(new Uint8Array(buffer));
            });
        }

        function decompressText(encoded) {
            var stream = new Blob([base64UrlToBytes(encoded)]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
            return new Response(stream).text();
        }

        function persistEntries() {
            var snapshot = JSON.stringify({ savedAt: Date.now(), entries: entries, theme: currentTheme });
            try {
                window.name = WINDOW_NAME_PREFIX + snapshot;
            } catch (e) {
                console.error('Error saving notes to window.name:', e);
            }
            clearTimeout(hashPersistTimer);
            hashPersistTimer = setTimeout(function() {
                compressText(snapshot).then(function(encoded) {
                    history.replaceState(null, '', location.href.split('%23')[0] + '%23' + HASH_PREFIX + encoded);
                }).catch(function(e) {
                    console.error('Error saving notes to the URL:', e);
                });
            }, HASH_PERSIST_DELAY);
        }

        function parseSnapshot(json) {
            var snapshot = JSON.parse(json);
            return snapshot && Array.isArray(snapshot.entries) ? snapshot : null;
        }

        function restorePersistedEntries() {
            var fromWindowName = null;
            if (window.name.indexOf(WINDOW_NAME_PREFIX) === 0) {
                try {
                    fromWindowName = parseSnapshot(window.name.slice(WINDOW_NAME_PREFIX.length));
                } catch (e) {
                    console.error('Error reading notes from window.name:', e);
                }
            }
            var hash = location.hash.slice(1);
            var fromHash = hash.indexOf(HASH_PREFIX) === 0
                ? decompressText(hash.slice(HASH_PREFIX.length)).then(parseSnapshot).catch(function(e) {
                    console.error('Error reading notes from the URL:', e);
                    return null;
                })
                : Promise.resolve(null);
            return fromHash.then(function(hashSnapshot) {
                var newest = [hashSnapshot, fromWindowName].filter(Boolean).sort(function(a, b) {
                    return b.savedAt - a.savedAt;
                })[0];
                if (newest && newest.theme) applyTheme(newest.theme);
                return newest ? JSON.stringify(newest.entries) : '';
            });
        }

        function loadEntries() {
            var storedEntries = entryContentStorage.value;
            if (!storedEntries) {
                entries = [];
                var defaultEntry = addNewEntry("Notes");
                current = 0;
                updateEntryList();
                clearAndLoadEntry(defaultEntry);
                return;
            }
            try {
                entries = JSON.parse(storedEntries);
                nextEntryId = entries.reduce(function(max, entry) { return Math.max(max, entry.id); }, -1) + 1;
                entries.forEach(function(entry) {
                    if (isSchedule(entry)) normalizeSchedule(entry);
                });
                current = entries.length > 0 ? 0 : -1;
                updateEntryList();
                updateEntryContent();
            } catch (e) {
                console.error('Error parsing entries:', e);
            }
        }

        function ensureDivWrapper(contentEditableDiv) {
            if (!contentEditableDiv) return;
            var htmlContent = contentEditableDiv.innerHTML.trim();
            if (htmlContent === "" || htmlContent === "<br>") {
                contentEditableDiv.innerHTML = "<div><br></div>";
            }
        }

        function addNewEntry(title) {
            var newEntry = {
                id: nextEntryId++,
                title: title,
                content: "",
                titleBarColor: DEFAULT_COLOR,
                contentBackgroundColor: DEFAULT_COLOR
            };
            entries.push(newEntry);
            saveEntries();
            return newEntry;
        }

        function reorderEntries(sourceIndex, targetIndex) {
            if (isNaN(sourceIndex) || sourceIndex === targetIndex) return;
            var currentEntry = entries[current];
            const movedItem = entries.splice(sourceIndex, 1)[0];
            entries.splice(targetIndex, 0, movedItem);
            current = entries.indexOf(currentEntry);
            updateEntryList();
            saveEntries();
        }

        function getContentPreview(html) {
            if (!html) return '';
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            tempDiv.querySelectorAll('div, p, li, br').forEach(function(el) {
                el.before(' ');
            });
            var text = (tempDiv.textContent || '').replace(/\[[ x]\]/g, '').replace(/\s+/g, ' ').trim();
            if (!text) return '';
            return text.length > 80 ? text.slice(0, 80) + '\u2026' : text;
        }

        function updateEntryPreview(entry) {
            var idx = entries.indexOf(entry);
            if (idx === -1) return;
            var row = entryList.querySelector('.entry-item[data-index="' + idx + '"]');
            if (!row) return;
            var previewEl = row.querySelector('.entry-item-preview');
            if (previewEl) previewEl.textContent = entryPreview(entry);
        }

        function isDefaultColor(color) {
            return !color || color.toLowerCase() === DEFAULT_COLOR;
        }

        function applyColorDotStyle(dotEl, color) {
            if (isDefaultColor(color)) {
                dotEl.style.removeProperty('--dot');
                dotEl.classList.add('color-dot-empty');
            } else {
                dotEl.style.setProperty('--dot', color);
                dotEl.classList.remove('color-dot-empty');
            }
        }

        function applyPageColor(pane, color) {
            if (isDefaultColor(color)) {
                pane.style.backgroundColor = '';
                pane.style.color = '';
                pane.classList.remove('has-page-color');
            } else {
                pane.style.backgroundColor = color;
                pane.style.color = isColorLight(color) ? '%231d1b18' : '%23f3efe9';
                pane.classList.add('has-page-color');
            }
        }

        function syncEntryColorUI(entry) {
            var idx = entries.indexOf(entry);
            if (idx !== -1) {
                var sidebarDot = entryList.querySelector('.entry-item[data-index="' + idx + '"] .color-dot');
                if (sidebarDot) applyColorDotStyle(sidebarDot, entry.titleBarColor);
            }
            document.querySelectorAll('.entry-pane[data-entry-id="' + entry.id + '"]').forEach(function(pane) {
                var titleDot = pane.querySelector('.pane-color-dot');
                if (titleDot) applyColorDotStyle(titleDot, entry.titleBarColor);
                applyPageColor(pane, entry.contentBackgroundColor);
            });
        }

        function attachInlineRename(entry, spanEl, inputEl, draggableToggleEl, onAfterCommit, trigger) {
            function enterEditMode(event) {
                if (event) event.stopPropagation();
                inputEl.value = entry.title;
                spanEl.style.display = 'none';
                inputEl.style.display = '';
                if (draggableToggleEl) draggableToggleEl.draggable = false;
                inputEl.focus();
                inputEl.select();
            }
            function exitEditMode() {
                var newTitle = inputEl.value.trim();
                if (newTitle && newTitle !== entry.title) {
                    entry.title = newTitle;
                    delete entry.autoTitle;
                    saveEntries();
                }
                spanEl.textContent = entry.title;
                inputEl.style.display = 'none';
                spanEl.style.display = '';
                if (draggableToggleEl) draggableToggleEl.draggable = true;
                if (onAfterCommit) onAfterCommit();
            }
            spanEl.addEventListener(trigger || 'dblclick', enterEditMode);
            spanEl._rename = enterEditMode;
            inputEl.addEventListener('blur', exitEditMode);
            inputEl.addEventListener('click', function(e) { e.stopPropagation(); });
            inputEl.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    inputEl.blur();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    e.stopPropagation();
                    inputEl.value = entry.title;
                    inputEl.blur();
                }
            });
            return { enter: enterEditMode };
        }

        function openEntry(index) {
            current = index;
            entryList.querySelectorAll('.entry-item').forEach(function(item) {
                item.classList.toggle('active', item.getAttribute('data-index') === String(index));
            });
            clearAndLoadEntry(entries[index]);
            closeDrawer();
        }

        function updateEntryList() {
            var entryListContainer = document.createElement("div");
            noteCount.textContent = entries.length;
            entries.forEach(function(entry, index) {
                var e = document.createElement("div");
                e.className = "entry-item" + (isSchedule(entry) ? " is-schedule" : "");
                e.setAttribute('data-index', index.toString());
                e.draggable = true;

                e.ondragstart = function(event) {
                    event.dataTransfer.setData("text/index", index.toString());
                    event.dataTransfer.setData("entry-index", index.toString());
                    e.classList.add('dragging');
                };
                e.ondragend = function() {
                    e.classList.remove('dragging');
                    entryContent.classList.remove('drop-target');
                };
                e.ondragover = function(event) {
                    if (event.dataTransfer.types.indexOf('text/index') === -1) return;
                    event.preventDefault();
                    e.classList.add('drag-over');
                };
                e.ondragleave = function() {
                    e.classList.remove('drag-over');
                };
                e.ondrop = function(event) {
                    event.preventDefault();
                    e.classList.remove('drag-over');
                    reorderEntries(parseInt(event.dataTransfer.getData("text/index")), index);
                };

                var colorDot = document.createElement("button");
                colorDot.type = "button";
                colorDot.className = "color-dot";
                colorDot.title = "Note colors";
                colorDot.setAttribute('aria-label', 'Colors for ' + entry.title);
                applyColorDotStyle(colorDot, entry.titleBarColor);
                colorDot.onclick = function(event) {
                    event.stopPropagation();
                    showColorPopover(entry, colorDot);
                };
                e.appendChild(colorDot);

                var textWrap = document.createElement("div");
                textWrap.className = "entry-item-text";

                var titleSpan = document.createElement("span");
                titleSpan.className = "entry-item-title";
                titleSpan.title = "Double-click to rename";
                titleSpan.textContent = entry.title;

                var titleInput = document.createElement("input");
                titleInput.type = "text";
                titleInput.className = "entry-item-title-input";
                titleInput.setAttribute('aria-label', 'Note title');
                titleInput.style.display = "none";

                attachInlineRename(entry, titleSpan, titleInput, e, function() {
                    document.querySelectorAll('.entry-pane[data-entry-id="' + entry.id + '"] .pane-title-text').forEach(function(el) {
                        el.textContent = entry.title;
                    });
                });

                var titleRow = document.createElement("div");
                titleRow.className = "entry-item-title-row";
                if (isSchedule(entry)) {
                    var typeIcon = createIcon(ICONS.calendar);
                    typeIcon.classList.add('entry-type-icon');
                    titleRow.appendChild(typeIcon);
                }
                titleRow.appendChild(titleSpan);
                titleRow.appendChild(titleInput);
                textWrap.appendChild(titleRow);

                var previewSpan = document.createElement("span");
                previewSpan.className = "entry-item-preview";
                previewSpan.textContent = entryPreview(entry);
                textWrap.appendChild(previewSpan);

                e.appendChild(textWrap);

                var deleteBtn = createIconButton(ICONS.trash, "Delete note");
                deleteBtn.className += " delete-btn";
                deleteBtn.onclick = function(event) {
                    event.stopPropagation();
                    showModal('Delete \u201c' + entry.title + '\u201d?', 'This can\u2019t be undone.', function() {
                        entries.splice(index, 1);
                        if (current === index) {
                            current = entries.length ? Math.min(index, entries.length - 1) : -1;
                        } else if (current > index) {
                            current -= 1;
                        }
                        updateEntryList();
                        updateEntryContent();
                        saveEntries();
                    });
                };
                e.appendChild(deleteBtn);

                if (index === current) {
                    e.classList.add("active");
                }

                e.onclick = function(event) {
                    if (event.detail > 1) return;
                    openEntry(index);
                };

                entryListContainer.appendChild(e);
            });
            entryList.innerHTML = '';
            entryList.appendChild(entryListContainer);
        }

        function isColorLight(color) {
            if (color.startsWith('%23')) {
                color = color.substring(1);
            }
            var r = parseInt(color.substr(0, 2), 16);
            var g = parseInt(color.substr(2, 2), 16);
            var b = parseInt(color.substr(4, 2), 16);
            var yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            return yiq >= 128;
        }

        var openPopover = null;

        function closePopover(refocus) {
            if (!openPopover) return;
            var p = openPopover;
            openPopover = null;
            p.el.remove();
            document.removeEventListener('mousedown', p.onOutside, true);
            document.removeEventListener('keydown', p.onKey, true);
            if (p.onClose) p.onClose();
            if (refocus && document.body.contains(p.anchor)) p.anchor.focus();
        }

        function showColorPopover(entry, anchor) {
            var reopen = openPopover && openPopover.anchor === anchor;
            closePopover();
            if (reopen) return;

            var pop = document.createElement('div');
            pop.className = 'popover';
            pop.setAttribute('role', 'dialog');
            pop.setAttribute('aria-label', 'Colors for ' + entry.title);

            function section(label, key, palette) {
                var wrap = document.createElement('div');
                wrap.className = 'popover-section';
                var heading = document.createElement('span');
                heading.className = 'popover-label';
                heading.textContent = label;
                wrap.appendChild(heading);
                var grid = document.createElement('div');
                grid.className = 'swatches';

                function choose(color) {
                    entry[key] = color;
                    saveEntries();
                    syncEntryColorUI(entry);
                    grid.querySelectorAll('.swatch').forEach(function(s) {
                        s.setAttribute('aria-pressed', String(s.dataset.color === color.toLowerCase()));
                    });
                }

                function addSwatch(name, color, extraClass) {
                    var b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'swatch' + (extraClass ? ' ' + extraClass : '');
                    b.title = name;
                    b.setAttribute('aria-label', name);
                    b.dataset.color = color;
                    b.style.setProperty('--swatch', color);
                    b.setAttribute('aria-pressed', String((entry[key] || DEFAULT_COLOR).toLowerCase() === color));
                    b.onclick = function() { choose(color); };
                    grid.appendChild(b);
                    return b;
                }

                addSwatch('None', DEFAULT_COLOR, 'swatch-none');
                palette.forEach(function(c) { addSwatch(c[0], c[1]); });

                var custom = document.createElement('label');
                custom.className = 'swatch swatch-custom';
                custom.title = 'Custom color';
                var input = document.createElement('input');
                input.type = 'color';
                input.setAttribute('aria-label', label + ': custom color');
                input.value = isDefaultColor(entry[key]) ? (key === 'titleBarColor' ? '%23b4441c' : '%23fbf3df') : entry[key];
                input.oninput = function() { choose(input.value); };
                custom.appendChild(input);
                grid.appendChild(custom);

                wrap.appendChild(grid);
                return wrap;
            }

            pop.appendChild(section('Label', 'titleBarColor', LABEL_COLORS));
            pop.appendChild(section('Page', 'contentBackgroundColor', PAGE_COLORS));
            presentPopover(pop, anchor, '.swatch[aria-pressed="true"]');
        }

        function presentPopover(pop, anchor, focusSelector) {
            document.body.appendChild(pop);

            var r = anchor.getBoundingClientRect();
            var w = pop.offsetWidth, h = pop.offsetHeight;
            var left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
            var top = r.bottom + 6;
            if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
            pop.style.left = left + 'px';
            pop.style.top = top + 'px';

            var state = {
                el: pop,
                anchor: anchor,
                onOutside: function(ev) {
                    if (!pop.contains(ev.target) && !anchor.contains(ev.target)) closePopover();
                },
                onKey: function(ev) {
                    if (ev.key === 'Escape') {
                        ev.stopPropagation();
                        closePopover(true);
                    }
                }
            };
            openPopover = state;
            document.addEventListener('mousedown', state.onOutside, true);
            document.addEventListener('keydown', state.onKey, true);
            var selected = pop.querySelector(focusSelector) || pop.querySelector('button');
            if (selected) selected.focus();
        }

        function showThemePopover(anchor) {
            var reopen = openPopover && openPopover.anchor === anchor;
            closePopover();
            if (reopen) return;

            var pop = document.createElement('div');
            pop.className = 'popover theme-popover';
            pop.setAttribute('role', 'dialog');
            pop.setAttribute('aria-label', 'Theme');

            THEMES.forEach(function(theme) {
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'theme-option';
                b.setAttribute('aria-pressed', String(theme.id === currentTheme));
                var chips = document.createElement('span');
                chips.className = 'theme-chips';
                chips.setAttribute('aria-hidden', 'true');
                theme.chips.forEach(function(c) {
                    var chip = document.createElement('span');
                    chip.style.background = c;
                    chips.appendChild(chip);
                });
                b.appendChild(chips);
                b.appendChild(document.createTextNode(theme.name));
                var check = createIcon(ICONS.check);
                check.classList.add('theme-check');
                b.appendChild(check);
                b.onclick = function() {
                    applyTheme(theme.id);
                    persistEntries();
                    pop.querySelectorAll('.theme-option').forEach(function(o) {
                        o.setAttribute('aria-pressed', String(o === b));
                    });
                };
                pop.appendChild(b);
            });

            var note = document.createElement('p');
            note.className = 'theme-note';
            note.textContent = 'Blank Page follows your system\u2019s light or dark setting.';
            pop.appendChild(note);

            presentPopover(pop, anchor, '.theme-option[aria-pressed="true"]');
        }

        function reorderPanes(sourcePaneId, targetPaneId) {
            if (sourcePaneId === targetPaneId) return;
            var sourcePane = entryContent.querySelector(`[data-entry-id='${sourcePaneId}']`);
            var targetPane = entryContent.querySelector(`[data-entry-id='${targetPaneId}']`);
            if (sourcePane && targetPane) {
                var isSourceBeforeTarget = sourcePane.compareDocumentPosition(targetPane) & Node.DOCUMENT_POSITION_FOLLOWING;
                if (isSourceBeforeTarget) {
                    targetPane.parentNode.insertBefore(sourcePane, targetPane.nextSibling);
                } else {
                    targetPane.parentNode.insertBefore(sourcePane, targetPane);
                }
                adjustPaneSizes();
            }
        }

        function adjustPaneSizes() {
            var splitContainers = entryContent.querySelectorAll('.split-horizontal');
            splitContainers.forEach(container => {
                var panes = Array.from(container.children);
                panes.forEach(pane => {
                    pane.style.flex = '1 1 0';
                });
            });
        }

        function renderEmptyState() {
            entryContent.innerHTML = '';
            var empty = document.createElement('div');
            empty.className = 'empty-state';
            var reveal = createIconButton(ICONS.panel, 'Show notes list');
            reveal.className += ' reveal-btn';
            reveal.onclick = toggleSidebar;
            empty.appendChild(reveal);
            var msg = document.createElement('p');
            msg.textContent = entries.length ? 'Pick a note from the list, or start a new one.' : 'No notes yet.';
            empty.appendChild(msg);
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'solid-btn';
            btn.appendChild(createIcon(ICONS.plus));
            btn.appendChild(document.createTextNode('New note'));
            btn.onclick = createNote;
            var schedBtn = document.createElement('button');
            schedBtn.type = 'button';
            schedBtn.className = 'ghost-btn';
            schedBtn.appendChild(createIcon(ICONS.calendar));
            schedBtn.appendChild(document.createTextNode('New schedule'));
            schedBtn.onclick = createSchedule;
            var btnRow = document.createElement('div');
            btnRow.className = 'empty-actions';
            btnRow.appendChild(btn);
            btnRow.appendChild(schedBtn);
            empty.appendChild(btnRow);
            entryContent.appendChild(empty);
        }

        function updateEntryContent() {
            if (current >= 0 && entries[current]) {
                clearAndLoadEntry(entries[current]);
            } else {
                renderEmptyState();
            }
        }

        function trapFocus(container, event) {
            if (event.key !== 'Tab') return;
            var items = container.querySelectorAll('button, a[href], input');
            if (!items.length) return;
            var first = items[0], last = items[items.length - 1];
            if (event.shiftKey && document.activeElement === first) {
                event.preventDefault();
                last.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
                event.preventDefault();
                first.focus();
            }
        }

        function showModal(title, detail, onConfirm) {
            var returnFocus = document.activeElement;
            var modal = document.createElement("div");
            modal.className = "modal";
            var modalContent = document.createElement("div");
            modalContent.className = "modal-content";
            modalContent.setAttribute('role', 'alertdialog');
            modalContent.setAttribute('aria-modal', 'true');
            modalContent.setAttribute('aria-labelledby', 'modal-title');
            var heading = document.createElement("h2");
            heading.id = 'modal-title';
            heading.textContent = title;
            var modalText = document.createElement("p");
            modalText.textContent = detail;
            var confirmButton = document.createElement("button");
            confirmButton.type = 'button';
            confirmButton.textContent = "Delete";
            confirmButton.className = "solid-btn danger";
            confirmButton.onclick = function() {
                close();
                onConfirm();
            };
            var cancelButton = document.createElement("button");
            cancelButton.type = 'button';
            cancelButton.textContent = "Cancel";
            cancelButton.className = "ghost-btn";
            cancelButton.onclick = close;
            modalContent.appendChild(heading);
            modalContent.appendChild(modalText);
            var modalActions = document.createElement("div");
            modalActions.className = "modal-actions";
            modalActions.appendChild(cancelButton);
            modalActions.appendChild(confirmButton);
            modalContent.appendChild(modalActions);
            modal.appendChild(modalContent);
            document.body.appendChild(modal);
            cancelButton.focus();

            function close() {
                modal.remove();
                document.removeEventListener('keydown', onKeyDown);
                if (returnFocus && document.body.contains(returnFocus)) returnFocus.focus();
            }
            function onKeyDown(e) {
                if (e.key === 'Escape') close();
                trapFocus(modalContent, e);
            }
            document.addEventListener('keydown', onKeyDown);
            modal.addEventListener('mousedown', function(event) {
                if (event.target === modal) close();
            });
        }

        function downloadFile(filename, text, mime) {
            var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
            var a = document.createElement('a');
            var url = URL.createObjectURL(blob);
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }

        function exportEntryAsText(entry) {
            if (isSchedule(entry)) {
                downloadFile((entry.title || 'schedule') + '.txt', scheduleAsText(entry));
                return;
            }
            var tempDiv = document.createElement("div");
            tempDiv.innerHTML = entry.content;
            tempDiv.querySelectorAll('div').forEach(div => {
                var checkbox = div.querySelector('input[type="checkbox"]');
                if (checkbox) {
                    div.insertAdjacentText('afterbegin', checkbox.checked ? '[x] ' : '[ ] ');
                }
                div.appendChild(document.createTextNode('\n'));

                    'DTEND:' + icsStamp(entry.date, ev.end),
                    'SUMMARY:' + icsEscape(ev.title || 'Untitled'),
                    'END:VEVENT'
                );
            });
            lines.push('END:VCALENDAR');
            downloadFile((entry.title || 'schedule') + '.ics', lines.join('\r\n') + '\r\n', 'text/calendar;charset=utf-8');
        }

        function copyText(text) {
            function fallback() {
                var ta = el('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                var ok = false;
                try {
                    ok = document.execCommand('copy');
                } catch (e) {
                    ok = false;
                }
                ta.remove();
                return ok ? Promise.resolve() : Promise.reject(new Error('copy failed'));
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text).catch(fallback);
            }
            return fallback();
        }

        function showToast(opts) {
            var host = document.querySelector('.toast-host');

                host = el('div', 'toast-host');
                host.setAttribute('role', 'status');
                host.setAttribute('aria-live', 'polite');

            }
            var toast = el('div', 'toast');
            var body = el('div', 'toast-body');
            body.appendChild(el('span', 'toast-text', opts.text));
            if (opts.detail) body.appendChild(el('span', 'toast-detail', opts.detail));
            toast.appendChild(body);
            var timer;
            function dismiss() {
                clearTimeout(timer);
                toast.remove();
            }
            if (opts.actionLabel) {
                var action = el('button', 'toast-action', opts.actionLabel);
                action.type = 'button';
                action.onclick = function() {
                    dismiss();
                    opts.onAction();
                };
                toast.appendChild(action);
            }
            var close = createIconButton(ICONS.close, 'Dismiss');
            close.onclick = dismiss;
            toast.appendChild(close);
            host.appendChild(toast);
            timer = setTimeout(dismiss, opts.timeout || 8000);
            return toast;
        }

        function scheduleDateTaken(key, except) {
            return entries.some(function(e) { return e !== except && isSchedule(e) && e.date === key; });
        }

        function addNewSchedule(key) {
            var entry = {
                id: nextEntryId++,
                type: 'schedule',
                title: shortDateLabel(key),
                autoTitle: true,
                date: key,
                view: 'day',
                events: [],
                content: '',
                titleBarColor: DEFAULT_COLOR,
                contentBackgroundColor: DEFAULT_COLOR
            };
            entries.push(entry);
            saveEntries();
            return entry;
        }

        function focusScheduleInput(pane) {
            var input = pane && pane.querySelector('.schedule-add-input');
            if (input) input.focus();
        }

        function openNewSchedule(entry) {
            current = entries.indexOf(entry);
            updateEntryList();
            closeDrawer();
            focusScheduleInput(clearAndLoadEntry(entry));
        }

        function createSchedule() {
            var key = dateKey();
            while (scheduleDateTaken(key)) key = shiftDateKey(key, 1);
            openNewSchedule(addNewSchedule(key));
        }

        function planNextDay(entry) {
            var key = shiftDateKey(entry.date, 1);
            var next = addNewSchedule(key);
            next.events = entry.events.filter(function(ev) { return !ev.done; }).map(function(ev) {
                return { id: newEventId(), start: ev.start, end: ev.end, title: ev.title, done: false, color: ev.color };
            });
            next.titleBarColor = entry.titleBarColor;
            next.contentBackgroundColor = entry.contentBackgroundColor;
            entries.splice(entries.indexOf(next), 1);
            entries.splice(entries.indexOf(entry) + 1, 0, next);
            saveEntries();
            openNewSchedule(next);
            var carried = next.events.length;
            showToast({ text: carried ? 'Carried over ' + carried + ' unfinished ' + (carried === 1 ? 'event' : 'events') + '.' : 'Started a plan for ' + longDateLabel(key) + '.' });
        }

        function setScheduleDate(entry, key) {
            if (!key || key === entry.date) return;
            entry.date = key;
            if (entry.autoTitle) {
                entry.title = shortDateLabel(key);
                document.querySelectorAll('.entry-pane[data-entry-id="' + entry.id + '"] .pane-title-text').forEach(function(span) {
                    span.textContent = entry.title;

            updateEntryList();

        function showEventEditor(entry, ev, anchor) {

                startInput.value = toHHMM(ev.start);

            startInput.onchange = function() {
                var s = fromHHMM(startInput.value);
                if (s === null) return;

                commitSchedule(entry);
            };
            endInput.onchange = function() {
                var e = fromHHMM(endInput.value);
                if (e === null) return;
                if (e === 0) e = DAY_MIN;
                if (e <= ev.start) e = Math.min(DAY_MIN, ev.start + SNAP_MIN);

                commitSchedule(entry);

            var grid = el('div', 'swatches event-swatches');

            doneLabel.appendChild(doneBox);

            actions.appendChild(doneLabel);
            var del = createTextButton(ICONS.trash, 'Delete');

                    removeEvent(entry, ev, true);

                var block = document.querySelector('.entry-pane[data-entry-id="' + entry.id + '"] .tl-event[data-event-id="' + ev.id + '"], .entry-pane[data-entry-id="' + entry.id + '"] .agenda-row[data-event-id="' + ev.id + '"] .agenda-title');
                if (block && document.activeElement === document.body) block.focus();

        function buildSchedule(entry, pane) {
            normalizeSchedule(entry);
            pane.classList.add('is-schedule');
            var root = el('div', 'schedule');

            var head = el('div', 'schedule-head');
            var dateWrap = el('div', 'schedule-date-wrap');
            var dateBtn = el('button', 'schedule-date');
            dateBtn.type = 'button';
            dateBtn.title = 'Change the day this plan is for';
            var dateText = el('span', 'schedule-date-text');
            var relBadge = el('span', 'schedule-rel');
            dateBtn.appendChild(dateText);
            dateBtn.appendChild(relBadge);
            var dateInput = el('input', 'schedule-date-input');
            dateInput.type = 'date';
            dateInput.tabIndex = -1;
            dateInput.setAttribute('aria-label', 'Plan date');
            dateBtn.onclick = function() {
                dateInput.value = entry.date;
                if (dateInput.showPicker) {
                    try {
                        dateInput.showPicker();

                    } catch (e) {
                        dateInput.classList.add('visible');
                    }
                }
                dateInput.classList.add('visible');
                dateInput.focus();
            };
            dateInput.onchange = function() {
                if (dateInput.value) setScheduleDate(entry, dateInput.value);

            dateInput.onblur = function() {
                dateInput.classList.remove('visible');

            dateWrap.appendChild(dateBtn);
            dateWrap.appendChild(dateInput);
            head.appendChild(dateWrap);

            var views = el('div', 'segmented');
            views.setAttribute('role', 'group');
            views.setAttribute('aria-label', 'View');
            [['day', 'Timeline'], ['list', 'List']].forEach(function(v) {
                var b = el('button', 'segmented-btn', v[1]);
                b.type = 'button';
                b.dataset.view = v[0];
                b.onclick = function() {
                    entry.view = v[0];
                    saveEntries();
                    render();
                };
                views.appendChild(b);
            });
            head.appendChild(views);
            root.appendChild(head);

            var status = el('div', 'schedule-status');
            root.appendChild(status);

            var add = el('div', 'schedule-add');
            add.appendChild(createIcon(ICONS.plus));
            var addInput = el('input', 'schedule-add-input');
            addInput.type = 'text';
            addInput.placeholder = 'Add an event \u2014 9:30 Standup, 2-3pm Gym, Lunch at 12 for 1h';
            addInput.setAttribute('aria-label', 'Add an event');
            addInput.setAttribute('autocomplete', 'off');
            add.appendChild(addInput);
            root.appendChild(add);
            var hint = el('div', 'schedule-add-hint');
            hint.setAttribute('aria-live', 'polite');
            root.appendChild(hint);

            function updateHint() {
                var value = addInput.value.trim();
                hint.textContent = '';
                hint.classList.toggle('active', !!value);
                if (!value) {
                    hint.textContent = 'Press Enter to add. Paste a list to add several at once. No time? It goes after your last event.';
                    return;
                }
                var p = parseEventText(value);
                var t = resolveParsed(entry, p);
                hint.appendChild(el('strong', '', formatTime(t.start) + ' \u2013 ' + formatTime(t.end)));
                hint.appendChild(document.createTextNode('  ' + (p.title || 'Untitled') + (p.start === null ? '  (next free slot)' : '')));
            }

            function flash(ids) {
                ids.forEach(function(id) {
                    var node = root.querySelector('[data-event-id="' + id + '"]');
                    if (node) {
                        node.classList.add('just-added');
                        if (node.scrollIntoView) node.scrollIntoView({ block: 'nearest' });
                    }
                });
            }

            function addLines(lines) {
                var ids = [];
                lines.forEach(function(line) {
                    var marker = /^\s*(?:(?:[-*\u2022]|\[[ xX]?\])\s*)+/.exec(line);
                    var clean = marker ? line.slice(marker[0].length) : line;
                    var ev = clean.trim() && addEventFromText(entry, clean);
                    if (!ev) return;
                    if (marker && /\[[xX]\]/.test(marker[0])) ev.done = true;
                    ids.push(ev.id);
                });
                if (!ids.length) return;
                commitSchedule(entry);
                flash(ids);
            }

            addInput.onkeydown = function(e) {
                if (e.key === 'Enter' && !e.isComposing) {
                    e.preventDefault();
                    if (!addInput.value.trim()) return;
                    addLines([addInput.value]);
                    addInput.value = '';
                    updateHint();
                } else if (e.key === 'Escape' && addInput.value) {
                    e.stopPropagation();
                    addInput.value = '';
                    updateHint();
                }
            };
            addInput.oninput = updateHint;
            addInput.onpaste = function(e) {
                var text = e.clipboardData && e.clipboardData.getData('text/plain');
                if (!text || !/\n/.test(text.trim())) return;
                e.preventDefault();
                addLines(text.split(/\r?\n/));
            };
            updateHint();

            var body = el('div', 'schedule-body');
            root.appendChild(body);

            var foot = el('div', 'schedule-foot');
            var copyBtn = createTextButton(ICONS.copy, 'Copy agenda', 'Copy this plan as text, e.g. for a standup message');
            copyBtn.onclick = function() {
                copyText(scheduleAsText(entry)).then(function() {
                    showToast({ text: 'Agenda copied.' });
                }, function() {
                    showToast({ text: 'Couldn\u2019t copy. Use the .txt export instead.' });
                });
            };
            var nextBtn = createTextButton(ICONS.arrowRight, 'Plan next day', 'Start a plan for the following day with this plan\u2019s unfinished events');
            nextBtn.onclick = function() { planNextDay(entry); };
            foot.appendChild(copyBtn);
            foot.appendChild(nextBtn);
            root.appendChild(foot);

            var drag = null;

            function renderStatus() {
                status.innerHTML = '';
                var state = scheduleState(entry);
                var chip = null;
                if (state.now) {
                    chip = el('span', 'status-chip now');
                    chip.appendChild(el('strong', '', 'Now'));
                    chip.appendChild(document.createTextNode(' ' + (state.now.title || 'Untitled') + ' \u00b7 until ' + formatTime(state.now.end)));
                } else if (state.next) {
                    var mins = state.next.start - nowMinutes();
                    chip = el('span', 'status-chip');
                    chip.appendChild(el('strong', '', 'Next'));
                    chip.appendChild(document.createTextNode(' ' + (state.next.title || 'Untitled') + ' \u00b7 ' + (mins < 60 ? 'in ' + mins + 'm' : formatTime(state.next.start))));
                }
                if (chip) status.appendChild(chip);
                var total = entry.events.length;
                if (!total) {
                    status.appendChild(el('span', 'status-summary', 'Nothing planned yet.'));
                    return;
                }
                var planned = entry.events.reduce(function(sum, ev) { return sum + (ev.end - ev.start); }, 0);
                var done = entry.events.filter(function(ev) { return ev.done; }).length;
                status.appendChild(el('span', 'status-summary', total + (total === 1 ? ' event' : ' events') + ' \u00b7 ' + formatDuration(planned) + ' planned \u00b7 ' + done + '/' + total + ' done'));
            }

            function eventClasses(node, ev) {
                var today = dayOffset(entry.date) === 0, m = nowMinutes();
                node.classList.toggle('done', ev.done);
                node.classList.toggle('past', today && ev.end <= m);
                node.classList.toggle('current', today && !ev.done && ev.start <= m && ev.end > m);
                if (ev.color) node.style.setProperty('--ev', ev.color);
            }

            function doneToggle(ev) {
                var cb = el('input', 'event-check');
                cb.type = 'checkbox';
                cb.checked = ev.done;
                cb.title = ev.done ? 'Mark as not done' : 'Mark as done';
                cb.setAttribute('aria-label', 'Done: ' + (ev.title || 'Untitled'));
                cb.onchange = function() {
                    ev.done = cb.checked;
                    commitSchedule(entry);
                };
                return cb;
            }

            function renderTimeline() {
                var startH = 7, endH = 21;
                var today = dayOffset(entry.date) === 0, now = nowMinutes();
                entry.events.forEach(function(ev) {
                    startH = Math.min(startH, Math.floor(ev.start / 60));
                    endH = Math.max(endH, Math.ceil(ev.end / 60));
                });
                if (today) {
                    startH = Math.min(startH, Math.floor(now / 60));
                    endH = Math.max(endH, Math.floor(now / 60) + 1);
                }
                endH = Math.min(24, endH);
                var rangeStart = startH * 60, rangeEnd = endH * 60;
                function y(min) {
                    return (min - rangeStart) / 60 * HOUR_PX;
                }

                var tl = el('div', 'timeline');
                tl.style.height = y(rangeEnd) + 'px';
                tl.style.setProperty('--hour', HOUR_PX + 'px');
                for (var h = startH; h <= endH; h++) {
                    var label = el('span', 'tl-hour', formatHour(h));
                    label.style.top = y(h * 60) + 'px';
                    tl.appendChild(label);
                }
                var layer = el('div', 'tl-events');
                tl.appendChild(layer);

                function place(node, ev, col, cols) {
                    node.style.top = y(ev.start) + 'px';
                    node.style.height = Math.max(20, y(ev.end) - y(ev.start) - 2) + 'px';
                    if (cols !== undefined) {
                        node.style.left = 'calc(' + (col / cols * 100) + '% + 2px)';
                        node.style.width = 'calc(' + (100 / cols) + '% - 4px)';
                    }
                    node.classList.toggle('short', ev.end - ev.start < 45);
                    var time = node.querySelector('.tl-time');
                    if (time) time.textContent = formatRange(ev);
                }

                layoutEvents(entry.events).forEach(function(item) {
                    var ev = item.ev;
                    var node = el('div', 'tl-event');
                    node.dataset.eventId = ev.id;
                    node.tabIndex = 0;
                    node.setAttribute('role', 'button');
                    node.setAttribute('aria-label', (ev.title || 'Untitled') + ', ' + formatRange(ev) + (ev.done ? ', done' : ''));
                    eventClasses(node, ev);
                    node.appendChild(doneToggle(ev));
                    var text = el('div', 'tl-text');
                    text.appendChild(el('span', 'tl-title', ev.title || 'Untitled'));
                    text.appendChild(el('span', 'tl-time'));
                    node.appendChild(text);
                    var grip = el('div', 'tl-resize');
                    grip.title = 'Drag to change the end time';
                    node.appendChild(grip);
                    node.onkeydown = function(e) {
                        if (e.target !== node) return;
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            showEventEditor(entry, ev, node);
                        } else if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
                            e.preventDefault();
                            var step = e.key === 'ArrowUp' ? -SNAP_MIN : SNAP_MIN;
                            if (e.shiftKey) {
                                ev.end = clamp(ev.end + step, ev.start + SNAP_MIN, DAY_MIN);
                            } else {
                                var len = ev.end - ev.start;
                                ev.start = clamp(ev.start + step, 0, DAY_MIN - len);
                                ev.end = ev.start + len;
                            }
                            commitSchedule(entry);
                            var again = root.querySelector('.tl-event[data-event-id="' + ev.id + '"]');
                            if (again) again.focus();
                        } else if (e.key === 'Delete') {
                            e.preventDefault();
                            removeEvent(entry, ev);
                        }
                    };
                    place(node, ev, item.col, item.cols);
                    node._ev = ev;
                    layer.appendChild(node);
                });

                if (today) {
                    var line = el('div', 'tl-now');
                    line.style.top = y(now) + 'px';
                    line.setAttribute('aria-hidden', 'true');
                    tl.appendChild(line);
                }

                function minuteAt(clientY) {
                    return rangeStart + (clientY - layer.getBoundingClientRect().top) / HOUR_PX * 60;
                }

                layer.onpointerdown = function(e) {
                    if (e.button !== 0 || e.target.closest('input')) return;
                    if (openPopover) {
                        closePopover();
                        e.preventDefault();
                        return;
                    }
                    var node = e.target.closest('.tl-event');
                    drag = { id: e.pointerId, y0: e.clientY, moved: false, node: node };
                    if (node) {
                        drag.ev = node._ev;
                        drag.mode = e.target.closest('.tl-resize') ? 'resize' : 'move';
                        drag.start = drag.ev.start;
                        drag.end = drag.ev.end;
                        if (e.pointerType === 'mouse' || drag.mode === 'resize') e.preventDefault();
                    } else {
                        drag.mode = 'create';
                        drag.anchor = clamp(Math.floor(minuteAt(e.clientY) / SNAP_MIN) * SNAP_MIN, rangeStart, rangeEnd - SNAP_MIN);
                        e.preventDefault();
                    }
                    try {
                        layer.setPointerCapture(e.pointerId);
                    } catch (err) {
                        drag.capture = false;
                    }
                };

                layer.onpointermove = function(e) {
                    if (!drag || e.pointerId !== drag.id) return;
                    var dy = e.clientY - drag.y0;
                    if (!drag.moved && Math.abs(dy) < 4) return;
                    if (!drag.moved) {
                        drag.moved = true;
                        pane._dragging = true;
                        root.classList.add('dragging');
                        if (drag.node) drag.node.classList.add('dragging');
                    }
                    var delta = snapMinutes(dy / HOUR_PX * 60);
                    if (drag.mode === 'move') {
                        var len = drag.end - drag.start;
                        drag.ev.start = clamp(drag.start + delta, rangeStart, rangeEnd - len);
                        drag.ev.end = drag.ev.start + len;
                        place(drag.node, drag.ev);
                    } else if (drag.mode === 'resize') {
                        drag.ev.end = clamp(drag.end + delta, drag.ev.start + SNAP_MIN, rangeEnd);
                        place(drag.node, drag.ev);
                    } else {
                        var cur = clamp(snapMinutes(minuteAt(e.clientY)), rangeStart, rangeEnd);
                        var ghostEv = {
                            start: Math.min(drag.anchor, cur),
                            end: Math.max(Math.min(drag.anchor, cur) + SNAP_MIN, Math.max(drag.anchor + SNAP_MIN, cur))
                        };
                        if (!drag.ghost) {
                            drag.ghost = el('div', 'tl-event tl-ghost');
                            drag.ghost.appendChild(el('span', 'tl-time'));
                            drag.ghost.style.left = '2px';
                            drag.ghost.style.right = '2px';
                            layer.appendChild(drag.ghost);
                        }
                        drag.ghostEv = ghostEv;
                        place(drag.ghost, ghostEv);
                    }
                };

                function endDrag(e, cancelled) {
                    if (!drag || e.pointerId !== drag.id) return;
                    var d = drag;
                    drag = null;
                    pane._dragging = false;
                    root.classList.remove('dragging');
                    if (cancelled) {
                        if (d.ev) {
                            d.ev.start = d.start;
                            d.ev.end = d.end;
                        }
                        render();
                        return;
                    }
                    if (d.mode === 'create') {
                        var span = d.moved && d.ghostEv ? d.ghostEv : { start: d.anchor, end: Math.min(rangeEnd, d.anchor + DEFAULT_EVENT_MIN) };
                        var ev = { id: newEventId(), start: span.start, end: Math.max(span.end, span.start + SNAP_MIN), title: '', done: false };
                        entry.events.push(ev);
                        commitSchedule(entry);
                        var created = root.querySelector('.tl-event[data-event-id="' + ev.id + '"]');
                        if (created) showEventEditor(entry, ev, created);
                    } else if (d.moved) {
                        commitSchedule(entry);
                    } else if (d.node) {
                        showEventEditor(entry, d.ev, d.node);
                    }
                }
                layer.onpointerup = function(e) { endDrag(e, false); };
                layer.onpointercancel = function(e) { endDrag(e, true); };

                body.appendChild(tl);
            }

            function renderList() {
                var list = el('div', 'agenda');
                if (!entry.events.length) {
                    list.appendChild(el('p', 'agenda-empty', 'No events yet. Add one above.'));
                }
                var prevEnd = null;
                entry.events.forEach(function(ev) {
                    if (prevEnd !== null && ev.start - prevEnd >= SNAP_MIN) {
                        list.appendChild(el('div', 'agenda-gap', formatDuration(ev.start - prevEnd) + ' free'));
                    }
                    prevEnd = prevEnd === null ? ev.end : Math.max(prevEnd, ev.end);
                    var row = el('div', 'agenda-row');
                    row.dataset.eventId = ev.id;
                    eventClasses(row, ev);
                    row.appendChild(doneToggle(ev));
                    var time = el('span', 'agenda-time');
                    time.appendChild(el('span', '', formatTime(ev.start)));
                    time.appendChild(el('span', 'agenda-end', formatTime(ev.end)));
                    row.appendChild(time);
                    var titleBtn = el('button', 'agenda-title', ev.title || 'Untitled');
                    titleBtn.type = 'button';
                    titleBtn.title = 'Edit event';
                    titleBtn.onclick = function() { showEventEditor(entry, ev, titleBtn); };
                    row.appendChild(titleBtn);
                    row.appendChild(el('span', 'agenda-length', formatDuration(ev.end - ev.start)));
                    list.appendChild(row);
                });
                body.appendChild(list);
            }

            function render() {
                dateText.textContent = longDateLabel(entry.date);
                var rel = relativeDayLabel(entry.date);
                relBadge.textContent = rel;
                relBadge.hidden = !rel;
                views.querySelectorAll('.segmented-btn').forEach(function(b) {
                    b.setAttribute('aria-pressed', String(b.dataset.view === entry.view));
                });
                renderStatus();
                body.innerHTML = '';
                body.className = 'schedule-body view-' + entry.view;
                if (entry.view === 'list') renderList();
                else renderTimeline();
            }

            pane._renderSchedule = function() {
                if (!pane._dragging) render();
            };
            pane._afterMount = function() {
                var target = root.querySelector('.tl-now') || root.querySelector('.tl-event, .agenda-row');
                if (!target) return;
                var offset = target.getBoundingClientRect().top - root.getBoundingClientRect().top;
                if (offset > root.clientHeight * 0.6) root.scrollTop = offset - root.clientHeight / 3;
            };
            render();
            return root;
        }

        function scheduleTick() {
            var today = dateKey(), m = nowMinutes();
            if (lastTickDate === today && m !== lastTickMinute) {
                entries.forEach(function(entry) {
                    if (!isSchedule(entry) || entry.date !== today) return;
                    entry.events.forEach(function(ev) {
                        if (ev.done || ev.start <= lastTickMinute || ev.start > m) return;
                        showToast({
                            text: 'Starting now: ' + (ev.title || 'Untitled'),
                            detail: formatRange(ev),
                            actionLabel: entries[current] === entry ? '' : 'Open',
                            onAction: function() {
                                var idx = entries.indexOf(entry);
                                if (idx !== -1) openEntry(idx);
                            },
                            timeout: 20000
                        });
                    });
                });
            }
            var changed = lastTickMinute !== m || lastTickDate !== today;
            lastTickDate = today;
            lastTickMinute = m;
            if (!changed) return;
            entries.forEach(function(entry) {
                if (!isSchedule(entry)) return;
                updateEntryPreview(entry);
                renderSchedulePanes(entry);
            });
        }

        setInterval(scheduleTick, 15000);

        function autoSaveEntries() {
            let currentEntries = JSON.stringify(entries);
            if (currentEntries !== lastSavedEntries) {
                saveEntries();
                lastSavedEntries = currentEntries;
            }
        }

        let lastSavedEntries = JSON.stringify(entries);

        setInterval(autoSaveEntries, 60000);

        var faviconUrl = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAGTElEQVRYw7VWfUyT+R3/PG0f7JWXFo0NBa7YBkqn4FvqghLXKDgN2qIuvmMWkXhRiYlLhiNhOZKRecvCLnOX3S6GqFmcxh0zK6acJyNoJHfDKpFOB4svlIBoeStn00OfPv3sj117K6jVk/smv+R5vq+f5/P7/n7fB0gg27Zty1i2bNkfjEbjY1EUqVaruWjRouajR4++kyj2raWkpGRTcnLyEwAEQEFIogAlAXDJkiXHvtfiq1atWqHRaJ4BYOb8H/Lgjr/y419OcPuPzxAA09PT//K9FN64ceP6zMzMVq1WGwRA26L3+OmHX/P3v+jjYss2que8SwA0m83HZ7VwfX29wmazvS+KYjhK+TtqA8/+5it++uEU56ZZv9kGgWazua+hoSFrNusL5eXlv1WpVBFBELhnzx5evnyZne3/YeufyOY/TtBq/QEBMDU1VXI4HEWJEq5du/Z9AF8A+CI3N7d98+bNP3mp89atW+uTkpIigiCwoaGBXq+Xx48f5/gw+dknpLeDHBkZ4YoVKwiAKSkpgyUlJZYEAP4cZRIARVGM2Gy2n89w3LVr18/UarUsCAJra2spyzLdbjfLysoYiZDD/V8zFJRIko8ePWJBQQEB0GAw3D9w4IAxEQCn08nKykoKgsCUlBSpsrIyP85Ro9FEAHD//v2UpP8VmpycZE9PD0kyEAiwt7c3ZvP5fMzLyyMAZmVl/fvQoUPvvgpATU0NZVmm0+kkABYWFsYdX1UoFBL0ej3sdjtu3LiBlStXIi0tDYWFhTGnUCiEhw8fwmw2w2g04tKlS1i3bh0GBgas586d67HZbP1KpTIOQH9/f4wdhUKBoqIiuFwueL1eRRwApVKJiYkJSJIEi2Xmtmo0GqhUKgSDQfh8PphMJlgsFrjdbmzfvh13797VeTyepYmaUqFQvFCv0ul0LWNjY466ujqEQiFUV1ejr68PV65cweHDhyGKIiwWCwKBADQaTSxw4cKF6OrqQnt7O7xeLyKRyIzkJLF8+fI4nSiKGZIkfauoqqoyzZ8/3wuAGzZsIEm63W6Kosje3l7OljQ1NVEQBKpUqvDq1as3x6EqLy/fAYAlJSWMRCJ0u90EwGPHjs0aAFmWefDgQQJgTk6Or6Wl5Vs6KyoqliuVSur1eo6MjMQAGAwGBoPBWQMxPj7OuXPnUqFQcPfu3aUAoAAAp9N5W6fTdfv9fmzatAmtra0AgOHhYbhcrkT99dqi0+lQWlqKSCSCmzdvFsQZHQ5HUXp6euD/by8AtNvtlGV51lioqamJjvOPYwwAQEtLy5elpaW27Ozsj6xW60OTydSvVqvlzs5O3LlzZ9ZYiN4XExMTiZ0XLFjwNwA8cuTIrDFQW1tLADQajfEMvEisVusnCoUicurUKXg8nlljIdoPCYWkYDQa//7NHxAvXLgQ+5JgMEifz/fS5ff7+ezZMz5//jyOgbq6OgLgvHnz/Hv37i1ICKK+vj5br9f/EwB37twZS3T+/HmKovjSVVFRwe7ubt6+fZuTk5OxuKGhIebn5xMAs7OzP1C8BoBBnU73u+n6SCQCSZKgUCio1WpjKykpiZIkQZZlkIQkSdi3bx96enoAAJmZmdiyZQsAIBwOQ/W2e2k2m/9RVla2K/p+9erVBo/H8170fWhoCC6XCx6PB21tbcjLy4MgCLH4hAy8oj+iTEiNjY2jjY2No6mpqePDw8N2AMjPzwdJXLx4EeFwGAMDA2hqapqR5zsBePr0KU6ePBnDEn3o7+//0ePHj/NTU1Nht9sxNTUFt9s9A/RbA2htbUVHRwfUavVXycnJv4rqu7q6firLsrBmzRpotVpcu3YNfr//lbm+E4Do7M/KyvrXrVu3vgSAM2fOzHvy5MlWQRDgcDhAEs3NzVE/vizXGwEgGVsA         changeFavicon(faviconUrl);

        var entryList = document.getElementById("entry-list"),
            entryContent = document.getElementById("entry-content"),
            entryContentStorage = document.getElementById("entry-content-storage"),
            fileInput = document.getElementById("file-input"),
            newEntryButton = document.getElementById("new-entry-button"),
            noteCount = document.getElementById("note-count"),
            entries = [],
            current = -1,
            nextEntryId = 0;

        newEntryButton.appendChild(createIcon(ICONS.plus));
        newEntryButton.appendChild(document.createTextNode('New note'));
        var newScheduleButton = document.getElementById('new-schedule-button');
        newScheduleButton.appendChild(createIcon(ICONS.calendar));
        newScheduleButton.appendChild(document.createTextNode('Schedule'));
        newScheduleButton.addEventListener('click', createSchedule);

        var collapseButton = createIconButton(ICONS.panel, 'Hide notes list');
        collapseButton.title = 'Hide notes list (Ctrl+\\)';
        collapseButton.onclick = toggleSidebar;
        document.querySelector('.sidebar-header').appendChild(collapseButton);
        document.querySelector('.drawer-scrim').onclick = closeDrawer;

        var footer = document.querySelector('.sidebar-footer');
        var saveDbButton = createTextButton(ICONS.download, 'Back up', 'Save all notes to a file');
        var loadDbButton = createTextButton(ICONS.upload, 'Restore', 'Load notes from a backup file');
        var themeButton = createIconButton(ICONS.palette, 'Theme');
        themeButton.className += ' theme-btn';
        themeButton.onclick = function() { showThemePopover(themeButton); };
        var helpButton = createIconButton(ICONS.help, 'Help and shortcuts');
        footer.appendChild(saveDbButton);
        footer.appendChild(loadDbButton);
        footer.appendChild(themeButton);
        footer.appendChild(helpButton);

        function showHelpOverlay() {
            var returnFocus = document.activeElement;
            var overlay = document.createElement('div');
            overlay.className = 'help-overlay';

            var card = document.createElement('div');
            card.className = 'help-card';
            card.setAttribute('role', 'dialog');
            card.setAttribute('aria-modal', 'true');
            card.setAttribute('aria-labelledby', 'help-title');

            var heading = document.createElement('h2');
            heading.id = 'help-title';
            heading.textContent = 'How it works';
            card.appendChild(heading);

            var closeBtn = createIconButton(ICONS.close, 'Close');
            closeBtn.className += ' help-close';
            closeBtn.onclick = function() { close(); };
            card.appendChild(closeBtn);

            function kbd(text) {
                var k = document.createElement('kbd');
                k.textContent = text;
                return k;
            }

            var list = document.createElement('dl');
            list.className = 'help-list';
            var tips = [
                ['Saving', ['Notes save into this page\u2019s address as you type, so refreshing is safe. To keep them after closing the tab, press ', kbd('Ctrl'), ' ', kbd('D'), ' to bookmark this page.']],
                ['Backups', ['Back up saves every note to a file. Restore loads that file again.']],
                ['Rename', ['Click the title of the open note, or double-click a note in the list.']],
                ['Schedules', ['Click ', kbd('Schedule'), ' to plan a day. Type events like ', kbd('9:30 Standup'), ', ', kbd('2-3pm Gym'), ' or ', kbd('Lunch at 12 for 1h'), ' and press ', kbd('Enter'), '; paste several lines to add them all. Drag an event to move it, drag its bottom edge to resize, and click or drag on empty time to add one. Events starting now pop up a reminder while this tab is open.']],
                ['Lists', ['Start a line with ', kbd('[ ]'), ' or ', kbd('[x]'), ' and a space for a checkbox, or ', kbd('*'), ' or ', kbd('-'), ' and a space for a bullet. ', kbd('Enter'), ' adds the next item; ', kbd('Enter'), ' on an empty item ends the list. ', kbd('Ctrl'), ' ', kbd('\u2191'), ' / ', kbd('\u2193'), ' moves a checkbox line.']],
                ['Arrange', ['Drag notes in the list to reorder them. Drag one onto the editor to open it side by side, and drag a pane\u2019s title to move it.']],
                ['Colors', ['Click the dot beside a title to set the note\u2019s label and page color.']],
                ['Export', ['The page icon beside a title saves that note as a .txt file.']],
                ['Theme', ['The palette button at the bottom of the list changes the app\u2019s colors. Your choice is saved with your notes.']],
                ['Focus', [kbd('Ctrl'), ' ', kbd('\\'), ' hides or shows the notes list.']]
            ];
            tips.forEach(function(tip) {
                var dt = document.createElement('dt');
                dt.textContent = tip[0];
                var dd = document.createElement('dd');
                tip[1].forEach(function(part) {
                    dd.appendChild(typeof part === 'string' ? document.createTextNode(part) : part);
                });
                list.appendChild(dt);
                list.appendChild(dd);
            });
            card.appendChild(list);

            var footerP = document.createElement('p');
            footerP.className = 'help-footer';
            var link = document.createElement('a');
            link.href = 'https://github.com/pwillia7/Text_Bookmarklet';
            link.target = '_blank';
            link.rel = 'noopener';
            link.textContent = 'project page on GitHub';
            footerP.appendChild(document.createTextNode('Source and issues: '));
            footerP.appendChild(link);
            card.appendChild(footerP);

            overlay.appendChild(card);
            document.body.appendChild(overlay);
            closeBtn.focus();

            function close() {
                overlay.remove();
                document.removeEventListener('keydown', onKeyDown);
                if (returnFocus && document.body.contains(returnFocus)) returnFocus.focus();
            }
            function onKeyDown(e) {
                if (e.key === 'Escape') close();
                trapFocus(card, e);
            }
            document.addEventListener('keydown', onKeyDown);
            overlay.addEventListener('mousedown', function(event) {
                if (event.target === overlay) close();
            });
        }

        helpButton.addEventListener('click', showHelpOverlay);

        function createNote() {
            var newEntry = addNewEntry("Untitled");
            current = entries.length - 1;
            updateEntryList();
            closeDrawer();
            var pane = clearAndLoadEntry(newEntry);
            var titleSpan = pane.querySelector('.pane-title-text');
            if (titleSpan && titleSpan._rename) {
                titleSpan._rename();
            }
        }

        newEntryButton.addEventListener('click', createNote);

        loadDbButton.addEventListener('click', function() {
            fileInput.value = '';
            fileInput.click();
            fileInput.onchange = function(e) {
                var file = e.target.files[0];
                if (file) {
                    var reader = new FileReader();
                    reader.onload = function(event) {
                        entryContentStorage.value = event.target.result;
                        loadEntries();
                        persistEntries();
                        lastSavedEntries = JSON.stringify(entries);
                    };
                    reader.readAsText(file);
                }
            };
        });

        saveDbButton.addEventListener('click', function() {
            var content = entryContentStorage.value,
                blob = new Blob([content], {type: 'text/plain;charset=utf-8'}),
                a = document.createElement('a'),
                date = new Date(),
                dateString = date.toISOString().split('T')[0];

            var url = URL.createObjectURL(blob);
            a.href = url;
            a.download = 'notes_database_' + dateString + '.txt';
            document.body.appendChild(a);
            a.click();
            URL.revokeObjectURL(url);
            document.body.removeChild(a);
        });

        entryContent.addEventListener('dragenter', function(event) {
            if (event.dataTransfer.types.indexOf('entry-index') !== -1) {
                entryContent.classList.add('drop-target');
            }
        });

        entryContent.addEventListener('dragleave', function(event) {
            if (!event.relatedTarget || !entryContent.contains(event.relatedTarget)) {
                entryContent.classList.remove('drop-target');
            }
        });

        entryContent.ondragover = function(event) {
            event.preventDefault();
        };

        entryContent.ondrop = function(event) {
            event.preventDefault();
            var targetPane = event.target.closest('.entry-pane');
            if (!targetPane) return;
            var sourcePaneId = event.dataTransfer.getData("pane-id");
            var targetPaneId = targetPane.dataset.entryId;
            if (sourcePaneId && targetPaneId && sourcePaneId !== targetPaneId) {
                reorderPanes(sourcePaneId, targetPaneId);
            }
        };

        entryContent.addEventListener('drop', function(event) {
            event.preventDefault();
            entryContent.classList.remove('drop-target');
            var entryIndex = event.dataTransfer.getData("entry-index");
            if (entryIndex !== '') {
                var entryToSplit = entries[parseInt(entryIndex)];
                splitPane(entryContent, entryToSplit);
            }
        });

        entryContent.addEventListener('input', function(event) {
            var editable = event.target.closest('.content-editable');
            if (editable) {
                ensureDivWrapper(editable);
                if (event.inputType === 'insertParagraph' && pendingListKind) {
                    continueList(editable, pendingListKind);
                } else if (event.inputType === 'insertText') {
                    autoFormatLine(editable);
                }
                pendingListKind = null;
                savePaneContent();
            }
        });

        entryList.ondragover = function(event) {
            event.preventDefault();
        };

        window.addEventListener('beforeunload', function(e) {
            e.preventDefault();
            e.returnValue = '';
        });

        MOBILE_QUERY.addEventListener('change', function() {
            document.body.classList.remove('drawer-open', 'sidebar-collapsed');
        });

        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === '\\') {
                e.preventDefault();
                toggleSidebar();
            } else if (e.key === 'Escape' && document.body.classList.contains('drawer-open')) {
                closeDrawer();
            }
        });

        entryContent.addEventListener('keydown', function(e) {
            if (e.target.closest && !e.target.closest('.content-editable')) return;
            if (e.ctrlKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
                var selection = window.getSelection();
                if (selection.rangeCount === 0) return;
                var range = selection.getRangeAt(0);
                var currentNode = range.startContainer;
                var currentElement = currentNode.nodeType === Node.ELEMENT_NODE ? currentNode : currentNode.parentElement;
                var isCheckboxLine = currentElement.nodeName === "INPUT" || (currentElement.nodeName === "DIV" && currentElement.querySelector('input[type="checkbox"]'));
                if (!isCheckboxLine) return;
                var currentDiv = currentElement.nodeName === "INPUT" ? currentElement : currentElement.closest('div');
                var siblingDiv = e.key === "ArrowUp" ? currentDiv.previousElementSibling : currentDiv.nextElementSibling;
                if (siblingDiv && (siblingDiv.querySelector('input[type="checkbox"]') || siblingDiv.nodeName === "INPUT")) {
                    e.preventDefault();
                    var movedDiv = moveCheckboxLine(currentDiv, siblingDiv, e.key);
                    setCursorToEnd(movedDiv);
                }
            }
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                pendingListKind = null;
                var editable = e.target.closest('.content-editable');
                var line = editable && getCaretLine(editable);
                var kind = line && lineKind(line);
                if (kind) {
                    if (lineIsEmptyItem(line, kind)) {
                        e.preventDefault();
                        line.innerHTML = '<br>';
                        placeCaret(line, 0);
                        savePaneContent();
                    } else {
                        pendingListKind = kind;
                    }
                }
            }
            if (e.key === 'Tab') {
                e.preventDefault();
                document.execCommand('insertHTML', false, '&nbsp;&nbsp;&nbsp;&nbsp;');
            }
        });

        document.execCommand('defaultParagraphSeparator', false, 'div');

        document.addEventListener('DOMContentLoaded', function() {
            restorePersistedEntries().then(function(storedEntries) {
                entryContentStorage.value = storedEntries;
                loadEntries();
                lastSavedEntries = JSON.stringify(entries);
                scheduleTick();
            });
        });

    </script>
