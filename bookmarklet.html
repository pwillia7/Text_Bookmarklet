(--border-hover)%3B%0A%20%20%20%20border-radius%3A%2010px%3B%0A%20%20%20%20border%3A%202px%20solid%20transparent%3B%0A%20%20%20%20background-clip%3A%20padding-box%3B%0A%7D%0A%0A*%20%7B%0A%20%20%20%20scrollbar-width%3A%20thin%3B%0A%20%20%20%20scrollbar-color%3A%20var(--border-hover)%20transparent%3B%0A%7D%0A%0A%2F*%20Responsive%20*%2F%0A%0A%40media%20screen%20and%20(max-width%3A%20720px)%20%7B%0A%20%20%20%20.content-area%20%7B%0A%20%20%20%20%20%20%20%20flex-direction%3A%20column%3B%0A%20%20%20%20%7D%0A%0A%20%20%20%20.sidebar%20%7B%0A%20%20%20%20%20%20%20%20width%3A%20100%25%3B%0A%20%20%20%20%20%20%20%20max-height%3A%2040%25%3B%0A%20%20%20%20%20%20%20%20border-right%3A%20none%3B%0A%20%20%20%20%20%20%20%20border-bottom%3A%201px%20solid%20var(--border)%3B%0A%20%20%20%20%7D%0A%0A%20%20%20%20.edge-toggle-vertical%20%7B%0A%20%20%20%20%20%20%20%20display%3A%20none%3B%0A%20%20%20%20%7D%0A%0A%20%20%20%20.editor%20%7B%0A%20%20%20%20%20%20%20%20padding%3A%2012px%3B%0A%20%20%20%20%7D%0A%0A%20%20%20%20.pane-title-text%2C%20.pane-title-input%20%7B%0A%20%20%20%20%20%20%20%20font-size%3A%201.1rem%3B%0A%20%20%20%20%7D%0A%7D%0A    </style>

<body>
    <div class="top-bar">
        <div class="top-bar-actions"></div>
    </div>
    <div class="content-area">
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <span class="app-name">Notes</span>
            </div>
            <button id="new-entry-button" class="new-note-btn" type="button"></button>
            <div id="entry-list" class="entry-list"></div>
        </aside>
        <div id="entry-content" class="editor"></div>
    </div>
    <textarea id="entry-content-storage" style="display:none;"></textarea>
    <input id="file-input" type="file" style="display: none;">
    <script type="text/javascript">
        function svgEl(tag, attrs) {
            var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
            for (var key in attrs) {
                el.setAttribute(key, attrs[key]);
            }
            return el;
        }

        function createIcon(children) {
            var svg = svgEl('svg', {
                viewBox: '0 0 24 24',
                width: '18',
                height: '18',
                fill: 'none',
                stroke: 'currentColor',
                'stroke-width': '2',
                'stroke-linecap': 'round',
                'stroke-linejoin': 'round'
            });
            svg.classList.add('icon');
            children.forEach(function(child) {
                svg.appendChild(svgEl(child.tag, child.attrs));
            });
            return svg;
        }

        var ICONS = {
            plus: [
                { tag: 'line', attrs: { x1: 12, y1: 5, x2: 12, y2: 19 } },
                { tag: 'line', attrs: { x1: 5, y1: 12, x2: 19, y2: 12 } }
            ],
            trash: [
                { tag: 'polyline', attrs: { points: '4 7 20 7' } },
                { tag: 'path', attrs: { d: 'M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13' } },
                { tag: 'path', attrs: { d: 'M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3' } },
                { tag: 'line', attrs: { x1: 10, y1: 11, x2: 10, y2: 17 } },
                { tag: 'line', attrs: { x1: 14, y1: 11, x2: 14, y2: 17 } }
            ],
            chevronLeft: [{ tag: 'polyline', attrs: { points: '15 18 9 12 15 6' } }],
            chevronRight: [{ tag: 'polyline', attrs: { points: '9 18 15 12 9 6' } }],
            chevronUp: [{ tag: 'polyline', attrs: { points: '18 15 12 9 6 15' } }],
            chevronDown: [{ tag: 'polyline', attrs: { points: '6 9 12 15 18 9' } }],
            help: [
                { tag: 'circle', attrs: { cx: 12, cy: 12, r: 10 } },
                { tag: 'path', attrs: { d: 'M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3' } },
                { tag: 'line', attrs: { x1: 12, y1: 17, x2: 12.01, y2: 17 } }
            ],
            close: [
                { tag: 'line', attrs: { x1: 18, y1: 6, x2: 6, y2: 18 } },
                { tag: 'line', attrs: { x1: 6, y1: 6, x2: 18, y2: 18 } }
            ],
            fileText: [
                { tag: 'path', attrs: { d: 'M14 3v4a1 1 0 0 0 1 1h4' } },
                { tag: 'path', attrs: { d: 'M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z' } },
                { tag: 'line', attrs: { x1: 9, y1: 13, x2: 15, y2: 13 } },
                { tag: 'line', attrs: { x1: 9, y1: 17, x2: 13, y2: 17 } }
            ],
            download: [
                { tag: 'path', attrs: { d: 'M12 3v12' } },
                { tag: 'polyline', attrs: { points: '7 10 12 15 17 10' } },
                { tag: 'path', attrs: { d: 'M5 19h14' } }
            ],
            upload: [
                { tag: 'path', attrs: { d: 'M12 21V9' } },
                { tag: 'polyline', attrs: { points: '7 14 12 9 17 14' } },
                { tag: 'path', attrs: { d: 'M5 5h14' } }
            ]
        };

        var DEFAULT_COLOR = '%23ffffff';

        function changeFavicon(url) {
            var link = document.createElement('link'),
                oldLink = document.querySelector('link[rel="shortcut icon"]') || document.querySelector('link[rel="icon"]');
            link.rel = 'shortcut icon';
            link.href = url;

            if (oldLink) {
                document.head.removeChild(oldLink);
            }
            document.head.appendChild(link);
        }

        function createToggleButton(iconPaths, orientationClass) {
            var button = document.createElement('button');
            button.type = 'button';
            button.className = 'edge-toggle ' + orientationClass;
            button.appendChild(createIcon(iconPaths));
            return button;
        }

        function createIconButton(iconPaths, label) {
            var button = document.createElement('button');
            button.type = 'button';
            button.className = 'icon-btn';
            button.title = label;
            button.setAttribute('aria-label', label);
            button.appendChild(createIcon(iconPaths));
            return button;
        }

        function savePaneContent() {
            var allPanes = entryContent.querySelectorAll('.entry-pane');
            allPanes.forEach(pane => {
                var entryId = pane.dataset.entryId;
                var contentDiv = pane.querySelector('div[contenteditable="true"]');
                if (contentDiv && entryId !== undefined) {
                    var entryIndex = entries.findIndex(entry => entry.id.toString() === entryId);
                    if (entryIndex !== -1) {
                        var clone = contentDiv.cloneNode(true);
                        clone.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                            var textNode = document.createTextNode(checkbox.checked ? '[x] ' : '[ ] ');
                            checkbox.parentNode.replaceChild(textNode, checkbox);
                        });
                        entries[entryIndex].content = clone.innerHTML;
                        updateEntryPreview(entries[entryIndex]);
                    }
                }
            });
            saveEntries();
        }

        function saveEntries() {
            entryContentStorage.value = JSON.stringify(entries);
        }

        function loadEntries() {
            var storedEntries = entryContentStorage.value;
            if (!storedEntries) {
                entries = [];
                var defaultEntry = addNewEntry("Notes");
                current = 0;
                updateEntryList();
                clearAndLoadEntry(defaultEntry);
                return;
            }
            try {
                entries = JSON.parse(storedEntries);
                nextEntryId = entries.reduce(function(max, entry) { return Math.max(max, entry.id); }, -1) + 1;
                updateEntryList();
                if (entries.length > 0) {
                    current = 0;
                    clearAndLoadEntry(entries[current]);
                }
            } catch (e) {
                console.error('Error parsing entries:', e);
            }
        }

        function ensureDivWrapper(contentEditableDiv) {
            var htmlContent = contentEditableDiv.innerHTML.trim();
            if (htmlContent === "" || htmlContent === "<br>") {
                contentEditableDiv.innerHTML = "<div><br></div>";
            }
        }

        function addNewEntry(title) {
            var newEntry = {
                id: nextEntryId++,
                title: title,
                content: "",
                titleBarColor: DEFAULT_COLOR,
                contentBackgroundColor: DEFAULT_COLOR
            };
            entries.push(newEntry);
            saveEntries();
            return newEntry;
        }

        function reorderEntries(sourceIndex, targetIndex) {
            if (sourceIndex === targetIndex) return;
            const movedItem = entries.splice(sourceIndex, 1)[0];
            entries.splice(targetIndex, 0, movedItem);
            updateEntryList();
            saveEntries();
        }

        function addDragAndDropVisuals() {
            document.querySelectorAll('.entry-item').forEach(item => {
                item.ondragstart = function() {
                    item.classList.add('dragging');
                };
                item.ondragend = function() {
                    item.classList.remove('dragging');
                };
                item.ondragover = function() {
                    item.classList.add('drag-over');
                };
                item.ondragleave = function() {
                    item.classList.remove('drag-over');
                };
            });
        }

        function getContentPreview(html) {
            if (!html) return '';
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            var text = (tempDiv.textContent || '').replace(/\s+/g, ' ').trim();
            if (!text) return '';
            return text.length > 64 ? text.slice(0, 64) + '...' : text;
        }

        function updateEntryPreview(entry) {
            var idx = entries.indexOf(entry);
            if (idx === -1) return;
            var row = entryList.querySelector('.entry-item[data-index="' + idx + '"]');
            if (!row) return;
            var previewEl = row.querySelector('.entry-item-preview');
            var preview = getContentPreview(entry.content);
            if (preview && previewEl) {
                previewEl.textContent = preview;
            } else if (preview && !previewEl) {
                previewEl = document.createElement('span');
                previewEl.className = 'entry-item-preview';
                previewEl.textContent = preview;
                row.querySelector('.entry-item-text').appendChild(previewEl);
            } else if (!preview && previewEl) {
                previewEl.remove();
            }
        }

        function applyColorDotStyle(dotEl, color) {
            var isDefault = !color || color.toLowerCase() === DEFAULT_COLOR.toLowerCase();
            if (isDefault) {
                dotEl.style.backgroundColor = 'transparent';
                dotEl.classList.add('color-dot-empty');
            } else {
                dotEl.style.backgroundColor = color;
                dotEl.classList.remove('color-dot-empty');
            }
        }

        function applyContentBackground(contentDiv, color) {
            var isDefault = !color || color.toLowerCase() === DEFAULT_COLOR.toLowerCase();
            if (isDefault) {
                contentDiv.style.backgroundColor = '';
                contentDiv.style.color = '';
            } else {
                contentDiv.style.backgroundColor = color;
                contentDiv.style.color = isColorLight(color) ? 'black' : 'white';
            }
        }

        function syncEntryColorUI(entry) {
            var idx = entries.indexOf(entry);
            if (idx !== -1) {
                var sidebarDot = entryList.querySelector('.entry-item[data-index="' + idx + '"] .color-dot');
                if (sidebarDot) applyColorDotStyle(sidebarDot, entry.titleBarColor);
            }
            document.querySelectorAll('.entry-pane[data-entry-id="' + entry.id + '"]').forEach(function(pane) {
                var titleDot = pane.querySelector('.pane-color-dot');
                if (titleDot) applyColorDotStyle(titleDot, entry.titleBarColor);
                var contentDiv = pane.querySelector('.content-editable');
                if (contentDiv) applyContentBackground(contentDiv, entry.contentBackgroundColor);
                var bgDot = pane.querySelector('.bg-color-picker-icon');
                if (bgDot) applyColorDotStyle(bgDot, entry.contentBackgroundColor);
            });
        }

        function attachInlineRename(entry, spanEl, inputEl, draggableToggleEl, onAfterCommit) {
            function enterEditMode(event) {
                if (event) event.stopPropagation();
                inputEl.value = entry.title;
                spanEl.style.display = 'none';
                inputEl.style.display = '';
                if (draggableToggleEl) draggableToggleEl.draggable = false;
                inputEl.focus();
                inputEl.select();
            }
            function exitEditMode() {
                var newTitle = inputEl.value.trim();
                if (newTitle && newTitle !== entry.title) {
                    entry.title = newTitle;
                    saveEntries();
                }
                spanEl.textContent = entry.title;
                inputEl.style.display = 'none';
                spanEl.style.display = '';
                if (draggableToggleEl) draggableToggleEl.draggable = true;
                if (onAfterCommit) onAfterCommit();
            }
            spanEl.ondblclick = enterEditMode;
            inputEl.addEventListener('blur', exitEditMode);
            inputEl.addEventListener('click', function(e) { e.stopPropagation(); });
            inputEl.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    inputEl.blur();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    e.stopPropagation();
                    inputEl.value = entry.title;
                    inputEl.blur();
                }
            });
            return { enter: enterEditMode };
        }

        function updateEntryList() {
            var entryListContainer = document.createElement("div");
            entries.forEach(function(entry, index) {
                var e = document.createElement("div");
                e.className = "entry-item";
                e.setAttribute('data-index', index.toString());
                e.draggable = true;

                e.ondragstart = function(event) {
                    event.dataTransfer.setData("text/index", index.toString());
                };

                e.ondragover = function(event) {
                    event.preventDefault();
                };

                e.ondrop = function(event) {
                    event.preventDefault();
                    var sourceIndex = event.dataTransfer.getData("text/index");
                    reorderEntries(parseInt(sourceIndex), index);
                };

                var colorDot = document.createElement("button");
                colorDot.type = "button";
                colorDot.className = "color-dot color-btn";
                colorDot.title = "Note color";
                colorDot.setAttribute('aria-label', 'Note color');
                applyColorDotStyle(colorDot, entry.titleBarColor);
                colorDot.onclick = function(event) {
                    event.stopPropagation();
                    showColorPicker(entry, false, function() { syncEntryColorUI(entry); });
                };
                e.appendChild(colorDot);

                var textWrap = document.createElement("div");
                textWrap.className = "entry-item-text";

                var titleSpan = document.createElement("span");
                titleSpan.className = "entry-item-title";
                titleSpan.title = "Double-click to rename";
                titleSpan.textContent = entry.title;

                var titleInput = document.createElement("input");
                titleInput.type = "text";
                titleInput.className = "entry-item-title-input";
                titleInput.style.display = "none";

                attachInlineRename(entry, titleSpan, titleInput, e, function() {
                    document.querySelectorAll('.entry-pane[data-entry-id="' + entry.id + '"] .pane-title-text').forEach(function(el) {
                        el.textContent = entry.title;
                    });
                });

                textWrap.appendChild(titleSpan);
                textWrap.appendChild(titleInput);

                var preview = getContentPreview(entry.content);
                if (preview) {
                    var previewSpan = document.createElement("span");
                    previewSpan.className = "entry-item-preview";
                    previewSpan.textContent = preview;
                    textWrap.appendChild(previewSpan);
                }

                e.appendChild(textWrap);

                var deleteBtn = createIconButton(ICONS.trash, "Delete note");
                deleteBtn.className += " delete-btn";
                deleteBtn.onclick = function(event) {
                    event.stopPropagation();
                    showModal('Delete "' + entry.title + '"? This cannot be undone.', function() {
                        entries.splice(index, 1);
                        if (current === index) {
                            current = -1;
                            entryContent.classList.remove('active');
                        } else if (current > index) {
                            current -= 1;
                        }
                        updateEntryList();
                        addDragAndDropVisuals();
                        updateEntryContent();
                        saveEntries();
                    });
                };
                e.appendChild(deleteBtn);

                if (index === current) {
                    e.classList.add("active");
                    entryContent.classList.add('active');
                }

                e.onclick = function(event) {
                    if (event.detail > 1) return;
                    var prevActive = entryList.querySelector('.entry-item.active');
                    if (prevActive) prevActive.classList.remove('active');
                    current = index;
                    e.classList.add('active');
                    clearAndLoadEntry(entries[index]);
                };

                entryListContainer.appendChild(e);
            });
            entryList.innerHTML = '';
            entryList.appendChild(entryListContainer);
        }

        function isColorLight(color) {
            if (color.startsWith('%23')) {
                color = color.substring(1);
            }
            var r = parseInt(color.substr(0, 2), 16);
            var g = parseInt(color.substr(2, 2), 16);
            var b = parseInt(color.substr(4, 2), 16);
            var yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            return yiq >= 128;
        }

        function showColorPicker(entry, isBackgroundColor, onChange) {
            var colorPicker = document.createElement("input");
            colorPicker.type = "color";
            colorPicker.value = (isBackgroundColor ? entry.contentBackgroundColor : entry.titleBarColor) || DEFAULT_COLOR;
            colorPicker.style.position = 'fixed';
            colorPicker.style.left = '-9999px';
            colorPicker.style.top = '0';
            colorPicker.oninput = function() {
                var selectedColor = colorPicker.value;
                if (isBackgroundColor) {
                    entry.contentBackgroundColor = selectedColor;
                } else {
                    entry.titleBarColor = selectedColor;
                }
                saveEntries();
                if (onChange) onChange(selectedColor);
            };
            document.body.appendChild(colorPicker);
            colorPicker.click();

            function removeColorPicker() {
                if (document.body.contains(colorPicker)) {
                    document.body.removeChild(colorPicker);
                }
                document.removeEventListener('click', removeColorPicker);
            }

            setTimeout(() => {
                document.addEventListener('click', removeColorPicker);
            }, 0);

            colorPicker.onchange = function() {
                removeColorPicker();
            };
        }

        function reorderPanes(sourcePaneId, targetPaneId) {
            if (sourcePaneId === targetPaneId) return;
            var sourcePane = entryContent.querySelector(`[data-entry-id='${sourcePaneId}']`);
            var targetPane = entryContent.querySelector(`[data-entry-id='${targetPaneId}']`);
            if (sourcePane && targetPane) {
                var isSourceBeforeTarget = sourcePane.compareDocumentPosition(targetPane) & Node.DOCUMENT_POSITION_FOLLOWING;
                if (isSourceBeforeTarget) {
                    targetPane.parentNode.insertBefore(sourcePane, targetPane.nextSibling);
                } else {
                    targetPane.parentNode.insertBefore(sourcePane, targetPane);
                }
                adjustPaneSizes();
            }
        }

        function adjustPaneSizes() {
            var splitContainers = entryContent.querySelectorAll('.split-horizontal, .split-vertical');
            splitContainers.forEach(container => {
                var panes = Array.from(container.children);
                var flexBasis = 100 / panes.length + '%';
                panes.forEach(pane => {
                    pane.style.flexBasis = flexBasis;
                    pane.style.flexGrow = 1;
                });
            });
        }

        function updateEntryContent() {
            if (current >= 0 && entries[current]) {
                clearAndLoadEntry(entries[current]);
            } else {
                entryContent.innerHTML = "";
                entryContent.classList.remove('active');
            }
        }

        function showModal(message, onConfirm) {
            var modal = document.createElement("div");
            modal.className = "modal";
            var modalContent = document.createElement("div");
            modalContent.className = "modal-content";
            var modalText = document.createElement("p");
            modalText.textContent = message;
            var confirmButton = document.createElement("button");
            confirmButton.textContent = "Delete";
            confirmButton.className = "danger-btn";
            confirmButton.onclick = function() {
                onConfirm();
                modal.remove();
            };
            var cancelButton = document.createElement("button");
            cancelButton.textContent = "Cancel";
            cancelButton.className = "cancel-btn";
            cancelButton.onclick = function() {
                modal.remove();
            };
            modalContent.appendChild(modalText);
            var modalActions = document.createElement("div");
            modalActions.className = "modal-actions";
            modalActions.appendChild(cancelButton);
            modalActions.appendChild(confirmButton);
            modalContent.appendChild(modalActions);
            modal.appendChild(modalContent);
            document.body.appendChild(modal);

            function onKeyDown(e) {
                if (e.key === 'Escape') {
                    modal.remove();
                    document.removeEventListener('keydown', onKeyDown);
                }
            }
            document.addEventListener('keydown', onKeyDown);
        }

        function exportEntryAsText(entry) {
            var tempDiv = document.createElement("div");
            tempDiv.innerHTML = entry.content;
            tempDiv.querySelectorAll('div').forEach(div => {
                var checkbox = div.querySelector('input[type="checkbox"]');
                if (checkbox) {
                    div.insertAdjacentText('afterbegin', checkbox.checked ? '[x] ' : '[ ] ');
                }
                div.appendChild(document.createTextNode('\n'));
            });
            var plainText = tempDiv.textContent || tempDiv.innerText || "";
            plainText = plainText.replace(/&nbsp;/g, ' ');
            var title = entry.title || 'note';
            var blob = new Blob([plainText], {type: 'text/plain;charset=utf-8'});
            var a = document.createElement('a');
            var url = URL.createObjectURL(blob);
            a.href = url;
            a.download = title + '.txt';
            document.body.appendChild(a);
            a.click();
            URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }

        function createPane(entry, entryId) {
            var pane = document.createElement('div');
            pane.className = 'entry-pane';
            pane.dataset.entryId = entryId.toString();

            var titleBar = document.createElement('div');
            titleBar.className = 'pane-title';
            titleBar.draggable = true;
            titleBar.ondragstart = function(event) {
                event.dataTransfer.setData("pane-id", entryId.toString());
            };

            var titleColorDot = document.createElement('button');
            titleColorDot.type = 'button';
            titleColorDot.className = 'pane-color-dot color-dot';
            titleColorDot.title = 'Note color';
            titleColorDot.setAttribute('aria-label', 'Note color');
            applyColorDotStyle(titleColorDot, entry.titleBarColor);
            titleColorDot.onclick = function(event) {
                event.stopPropagation();
                showColorPicker(entry, false, function() { syncEntryColorUI(entry); });
            };
            titleBar.appendChild(titleColorDot);

            var titleTextSpan = document.createElement('span');
            titleTextSpan.className = 'pane-title-text';
            titleTextSpan.title = 'Double-click to rename';
            titleTextSpan.textContent = entry.title;

            var titleTextInput = document.createElement('input');
            titleTextInput.type = 'text';
            titleTextInput.className = 'pane-title-input';
            titleTextInput.style.display = 'none';

            attachInlineRename(entry, titleTextSpan, titleTextInput, titleBar, function() {
                updateEntryList();
            });

            titleBar.appendChild(titleTextSpan);
            titleBar.appendChild(titleTextInput);

            var titleActions = document.createElement('div');
            titleActions.className = 'pane-title-actions';
            var exportBtn = createIconButton(ICONS.fileText, 'Export as .txt');
            exportBtn.onclick = function(event) {
                event.stopPropagation();
                exportEntryAsText(entry);
            };
            titleActions.appendChild(exportBtn);
            titleBar.appendChild(titleActions);

            pane.appendChild(titleBar);

            var contentDiv = document.createElement('div');
            contentDiv.contentEditable = true;
            contentDiv.className = 'content-editable';
            applyContentBackground(contentDiv, entry.contentBackgroundColor);
            contentDiv.innerHTML = entry.content.replace(/\[ \]/g, '<input type="checkbox">').replace(/\[x\]/g, '<input type="checkbox" checked>');
            pane.appendChild(contentDiv);

            var bgColorPickerIcon = document.createElement('button');
            bgColorPickerIcon.type = 'button';
            bgColorPickerIcon.className = 'bg-color-picker-icon color-dot';
            bgColorPickerIcon.title = 'Page color';
            bgColorPickerIcon.setAttribute('aria-label', 'Page color');
            applyColorDotStyle(bgColorPickerIcon, entry.contentBackgroundColor);
            bgColorPickerIcon.onclick = function(event) {
                event.stopPropagation();
                showColorPicker(entry, true, function() { syncEntryColorUI(entry); });
            };
            pane.appendChild(bgColorPickerIcon);

            return pane;
        }

        function clearAndLoadEntry(entry) {
            entryContent.innerHTML = '';
            var pane = createPane(entry, entry.id);
            entryContent.appendChild(pane);
            ensureDivWrapper(pane.querySelector('.content-editable'));
            return pane;
        }

        function splitPane(container, entryToSplit) {
            var entryIndex = entries.findIndex(entry => entry === entryToSplit);
            if (entryIndex === -1) return;

            var newPane = createPane(entryToSplit, entryToSplit.id);
            if (container.children.length === 0) {
                container.appendChild(newPane);
            } else {
                var existingSplitContainer = container.querySelector('.split-horizontal');
                if (existingSplitContainer) {
                    existingSplitContainer.appendChild(newPane);
                } else {
                    var splitContainer = document.createElement('div');
                    splitContainer.className = 'split-horizontal';
                    splitContainer.appendChild(container.firstChild);
                    splitContainer.appendChild(newPane);

                    container.appendChild(splitContainer);
                }
            }
            adjustPaneSizes();
        }

        function toggleTopBar() {
            var topBar = document.querySelector('.top-bar');
            var isHidden = topBar.style.display === 'none';
            topBar.style.display = isHidden ? '' : 'none';
            toggleTopBarButton.innerHTML = '';
            toggleTopBarButton.appendChild(createIcon(isHidden ? ICONS.chevronUp : ICONS.chevronDown));
        }

        function toggleSidebar() {
            var sidebar = document.getElementById('sidebar');
            var isHidden = sidebar.style.display === 'none';
            sidebar.style.display = isHidden ? '' : 'none';
            toggleSidebarButton.innerHTML = '';
            toggleSidebarButton.appendChild(createIcon(isHidden ? ICONS.chevronLeft : ICONS.chevronRight));
        }

        function moveCursorToEnd(element) {
            var range = document.createRange();
            var sel = window.getSelection();
            range.setStart(element, 1);
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
            element.focus();
        }

        function createCheckboxLine() {
            var newCheckbox = document.createElement('input');
            newCheckbox.type = 'checkbox';
            var newDiv = document.createElement('div');
            newDiv.appendChild(newCheckbox);
            newDiv.appendChild(document.createTextNode(' '));
            return newDiv;
        }

        function createTextCheckboxLine() {
            var newDiv = document.createElement('div');
            newDiv.textContent = '[ ] ';
            return newDiv;
        }

        function moveCheckboxLine(currentDiv, siblingDiv, direction) {
            var movedDiv;
            if (direction === "ArrowUp") {
                currentDiv.parentNode.insertBefore(currentDiv, siblingDiv);
                movedDiv = currentDiv;
            } else {
                var nextSibling = siblingDiv.nextElementSibling;
                currentDiv.parentNode.insertBefore(currentDiv, nextSibling);
                movedDiv = currentDiv;
            }
            return movedDiv;
        }

        function setCursorToEnd(div) {
            var range = document.createRange();
            var sel = window.getSelection();
            range.selectNodeContents(div);
            range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);
        }

        function autoSaveEntries() {
            let currentEntries = JSON.stringify(entries);
            if (currentEntries !== lastSavedEntries) {
                saveEntries();
                lastSavedEntries = currentEntries;
            }
        }

        let lastSavedEntries = JSON.stringify(entries);

        setInterval(autoSaveEntries, 60000);

        var faviconUrl = 'https://reticulated.net/favicon/favicon.ico';
        changeFavicon(faviconUrl);

        var entryList = document.getElementById("entry-list"),
            entryContent = document.getElementById("entry-content"),
            entryContentStorage = document.getElementById("entry-content-storage"),
            fileInput = document.getElementById("file-input"),
            newEntryButton = document.getElementById("new-entry-button"),
            topBarActions = document.querySelector(".top-bar-actions"),
            entries = [],
            current = -1,
            nextEntryId = 0;

        newEntryButton.appendChild(createIcon(ICONS.plus));
        newEntryButton.appendChild(document.createTextNode(' New Note'));

        var saveDbButton = createIconButton(ICONS.download, 'Save database to a file');
        var loadDbButton = createIconButton(ICONS.upload, 'Load database from a file');
        var helpButton = createIconButton(ICONS.help, 'Help');
        topBarActions.appendChild(saveDbButton);
        topBarActions.appendChild(loadDbButton);
        topBarActions.appendChild(helpButton);

        var toggleSidebarButton = createToggleButton(ICONS.chevronLeft, 'edge-toggle-vertical');
        toggleSidebarButton.title = 'Toggle sidebar';
        toggleSidebarButton.setAttribute('aria-label', 'Toggle sidebar');
        toggleSidebarButton.onclick = toggleSidebar;
        document.querySelector('.content-area').insertBefore(toggleSidebarButton, entryContent);

        var toggleTopBarButton = createToggleButton(ICONS.chevronUp, 'edge-toggle-horizontal');
        toggleTopBarButton.title = 'Toggle top bar';
        toggleTopBarButton.setAttribute('aria-label', 'Toggle top bar');
        toggleTopBarButton.onclick = toggleTopBar;
        document.querySelector('.top-bar').parentNode.insertBefore(toggleTopBarButton, document.querySelector('.content-area'));

        function showHelpOverlay() {
            var overlay = document.createElement('div');
            overlay.className = 'help-overlay';

            var card = document.createElement('div');
            card.className = 'help-card';

            var closeBtn = createIconButton(ICONS.close, 'Close');
            closeBtn.className += ' help-close';
            closeBtn.onclick = function() { close(); };
            card.appendChild(closeBtn);

            var heading = document.createElement('h2');
            heading.textContent = 'Help & Tips';
            card.appendChild(heading);

            var list = document.createElement('ul');
            var tips = [
                ['New Note', 'Click "+ New Note" in the sidebar, then type a title right away.'],
                ['Rename', 'Double-click a note title (in the sidebar or the open note) to rename it in place.'],
                ['Split Panes', 'Drag a note from the sidebar onto the editor to open it side-by-side.'],
                ['Reorder Notes', 'Drag and drop notes in the sidebar, or drag split pane titles to reorder them.'],
                ['Checkboxes', 'Type "[ ] " for an unchecked box or "[x] " for a checked box.'],
                ['Colors', 'Click the color dot next to a title, or the dot in the corner of a note, to customize colors.'],
                ['Export a Note', 'Click the document icon in a note title bar to save it as a .txt file.'],
                ['Save / Load Database', 'Use the icons in the top bar to back up or restore all your notes as a file.'],
                ['Hide Panels', 'Use the small arrow tabs at the edges to hide the sidebar or top bar.']
            ];
            tips.forEach(function(tip) {
                var li = document.createElement('li');
                var strong = document.createElement('strong');
                strong.textContent = tip[0] + ': ';
                li.appendChild(strong);
                li.appendChild(document.createTextNode(tip[1]));
                list.appendChild(li);
            });
            card.appendChild(list);

            var footer = document.createElement('p');
            footer.className = 'help-footer';
            var link = document.createElement('a');
            link.href = 'https://github.com/pwillia7/Text_Bookmarklet';
            link.textContent = 'Project repository on GitHub';
            footer.appendChild(document.createTextNode('Read more at the '));
            footer.appendChild(link);
            card.appendChild(footer);

            overlay.appendChild(card);
            document.body.appendChild(overlay);

            function close() {
                overlay.remove();
                document.removeEventListener('keydown', onKeyDown);
            }
            function onKeyDown(e) {
                if (e.key === 'Escape') close();
            }
            document.addEventListener('keydown', onKeyDown);
            overlay.addEventListener('click', function(event) {
                if (event.target === overlay) close();
            });
        }

        helpButton.addEventListener('click', showHelpOverlay);

        newEntryButton.addEventListener('click', function() {
            var newEntry = addNewEntry("Untitled");
            current = entries.length - 1;
            updateEntryList();
            var pane = clearAndLoadEntry(newEntry);
            var titleSpan = pane.querySelector('.pane-title-text');
            if (titleSpan) {
                titleSpan.ondblclick();
            }
        });

        loadDbButton.addEventListener('click', function() {
            fileInput.click();
            fileInput.onchange = function(e) {
                var file = e.target.files[0];
                if (file) {
                    var reader = new FileReader();
                    reader.onload = function(event) {
                        entryContentStorage.value = event.target.result;
                        loadEntries();
                        lastSavedEntries = JSON.stringify(entries);
                    };
                    reader.readAsText(file);
                }
            };
        });

        saveDbButton.addEventListener('click', function() {
            var content = entryContentStorage.value,
                blob = new Blob([content], {type: 'text/plain;charset=utf-8'}),
                a = document.createElement('a'),
                date = new Date(),
                dateString = date.toISOString().split('T')[0];

            var url = URL.createObjectURL(blob);
            a.href = url;
            a.download = 'notes_database_' + dateString + '.txt';
            document.body.appendChild(a);
            a.click();
            URL.revokeObjectURL(url);
            document.body.removeChild(a);
        });

        entryContent.addEventListener('dragover', function(event) {
            event.preventDefault();
        });

        entryContent.ondrop = function(event) {
            event.preventDefault();
            var targetPane = event.target.closest('.entry-pane');
            if (!targetPane) return;
            var sourcePaneId = event.dataTransfer.getData("pane-id");
            var targetPaneId = targetPane.dataset.entryId;
            if (sourcePaneId && targetPaneId && sourcePaneId !== targetPaneId) {
                reorderPanes(sourcePaneId, targetPaneId);
            }
        };

        entryContent.ondragover = function(event) {
            event.preventDefault();
        };

        entryContent.addEventListener('input', function(event) {
            var editable = event.target.closest('.content-editable');
            if (editable) {
                ensureDivWrapper(editable);
            }
            savePaneContent();
        });

        entryList.ondragover = function(event) {
            event.preventDefault();
        };

        entryList.addEventListener('dragstart', function(event) {
            if (event.target.classList.contains('entry-item')) {
                var entryIndex = event.target.getAttribute('data-index');
                event.dataTransfer.setData("entry-index", entryIndex);
            }
        });

        entryContent.addEventListener('drop', function(event) {
            event.preventDefault();
            var entryIndex = event.dataTransfer.getData("entry-index");
            if (entryIndex !== '') {
                var entryToSplit = entries[parseInt(entryIndex)];
                splitPane(entryContent, entryToSplit);
            }
        });

        window.addEventListener('beforeunload', function(e) {
            e.preventDefault();
            e.returnValue = '';
        });

        entryContent.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
                var selection = window.getSelection();
                if (selection.rangeCount === 0) return;
                var range = selection.getRangeAt(0);
                var currentNode = range.startContainer;
                var currentElement = currentNode.nodeType === Node.ELEMENT_NODE ? currentNode : currentNode.parentElement;
                var isCheckboxLine = currentElement.nodeName === "INPUT" || (currentElement.nodeName === "DIV" && currentElement.querySelector('input[type="checkbox"]'));
                if (!isCheckboxLine) return;
                var currentDiv = currentElement.nodeName === "INPUT" ? currentElement : currentElement.closest('div');
                var siblingDiv = e.key === "ArrowUp" ? currentDiv.previousElementSibling : currentDiv.nextElementSibling;
                if (siblingDiv && (siblingDiv.querySelector('input[type="checkbox"]') || siblingDiv.nodeName === "INPUT")) {
                    e.preventDefault();
                    var movedDiv = moveCheckboxLine(currentDiv, siblingDiv, e.key);
                    setCursorToEnd(movedDiv);
                }
            }
            if (e.key === 'Enter') {
                var selection = window.getSelection();
                if (selection.rangeCount > 0) {
                    var range = selection.getRangeAt(0);
                    var container = range.startContainer;
                    var parentDiv = container.nodeType === 3 ? container.parentNode : container;
                    var isCheckboxStart = parentDiv.textContent.trim().startsWith('[ ]');
                    var containsCheckboxInput = parentDiv.querySelector('input[type="checkbox"]') !== null;
                    var newLine;
                    if (isCheckboxStart || containsCheckboxInput) {
                        e.preventDefault();
                        newLine = isCheckboxStart ? createTextCheckboxLine() : createCheckboxLine();
                        if (parentDiv.isSameNode(entryContent.querySelector('.content-editable')) && entryContent.querySelector('.content-editable').childNodes.length === 1) {
                            entryContent.querySelector('.content-editable').appendChild(newLine);
                        } else {
                            parentDiv.after(newLine);
                        }
                        moveCursorToEnd(newLine);
                    }
                }
            }
            if (e.key === 'Tab') {
                e.preventDefault();
                document.execCommand('insertHTML', false, '&nbsp;&nbsp;&nbsp;&nbsp;');
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                if (entryContentStorage.value.trim().length > 0) {
                    loadEntries();
                } else {
                    entries = [];
                    var newEntry = addNewEntry("Notes");
                    current = 0;
                    updateEntryList();
                    clearAndLoadEntry(newEntry);
                }
            }, 250);
            addDragAndDropVisuals();
        });

    </script>
</body>
</html>
