<html>
<head>
    <title>Notes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
{{CSS}}</style>
</head>
<body>
    <aside id="sidebar" class="sidebar" aria-label="Notes">
        <div class="sidebar-header">
            <span class="app-name">Notes</span>
            <span id="note-count" class="note-count"></span>
        </div>
        <button id="new-entry-button" class="new-note-btn" type="button"></button>
        <div id="entry-list" class="entry-list"></div>
        <div class="sidebar-footer"></div>
    </aside>
    <div class="drawer-scrim"></div>
    <main id="entry-content" class="editor"></main>
    <textarea id="entry-content-storage" style="display:none;"></textarea>
    <input id="file-input" type="file" style="display: none;">
    <script type="text/javascript">
        function svgEl(tag, attrs) {
            var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
            for (var key in attrs) {
                el.setAttribute(key, attrs[key]);
            }
            return el;
        }

        function createIcon(children) {
            var svg = svgEl('svg', {
                viewBox: '0 0 24 24',
                width: '18',
                height: '18',
                fill: 'none',
                stroke: 'currentColor',
                'stroke-width': '1.8',
                'stroke-linecap': 'round',
                'stroke-linejoin': 'round',
                'aria-hidden': 'true'
            });
            svg.classList.add('icon');
            children.forEach(function(child) {
                svg.appendChild(svgEl(child.tag, child.attrs));
            });
            return svg;
        }

        var ICONS = {
            plus: [
                { tag: 'line', attrs: { x1: 12, y1: 5, x2: 12, y2: 19 } },
                { tag: 'line', attrs: { x1: 5, y1: 12, x2: 19, y2: 12 } }
            ],
            trash: [
                { tag: 'path', attrs: { d: 'M4 7h16' } },
                { tag: 'path', attrs: { d: 'M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12' } },
                { tag: 'path', attrs: { d: 'M9 7V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V7' } }
            ],
            panel: [
                { tag: 'rect', attrs: { x: 3, y: 4, width: 18, height: 16, rx: 2.5 } },
                { tag: 'path', attrs: { d: 'M9 4v16' } }
            ],
            help: [
                { tag: 'circle', attrs: { cx: 12, cy: 12, r: 9 } },
                { tag: 'path', attrs: { d: 'M9.6 9.3a2.5 2.5 0 0 1 4.8 1c0 1.7-2.4 2.1-2.4 3.4' } },
                { tag: 'path', attrs: { d: 'M12 17h.01' } }
            ],
            close: [
                { tag: 'path', attrs: { d: 'M17 7L7 17' } },
                { tag: 'path', attrs: { d: 'M7 7l10 10' } }
            ],
            exportTxt: [
                { tag: 'path', attrs: { d: 'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z' } },
                { tag: 'path', attrs: { d: 'M14 3v5h5' } },
                { tag: 'path', attrs: { d: 'M12 11v6' } },
                { tag: 'path', attrs: { d: 'M9.5 14.5L12 17l2.5-2.5' } }
            ],
            palette: [
                { tag: 'path', attrs: { d: 'M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8z' } },
                { tag: 'circle', attrs: { cx: 7.5, cy: 11.5, r: 1 } },
                { tag: 'circle', attrs: { cx: 10.5, cy: 7.5, r: 1 } },
                { tag: 'circle', attrs: { cx: 15.5, cy: 8.5, r: 1 } }
            ],
            check: [{ tag: 'path', attrs: { d: 'M5 12.5l4.5 4.5L19 7.5' } }],
            download: [
                { tag: 'path', attrs: { d: 'M12 4v11' } },
                { tag: 'path', attrs: { d: 'M7.5 10.5L12 15l4.5-4.5' } },
                { tag: 'path', attrs: { d: 'M5 20h14' } }
            ],
            upload: [
                { tag: 'path', attrs: { d: 'M12 20V9' } },
                { tag: 'path', attrs: { d: 'M7.5 13.5L12 9l4.5 4.5' } },
                { tag: 'path', attrs: { d: 'M5 4h14' } }
            ]
        };

        var DEFAULT_COLOR = '#ffffff';
        var LABEL_COLORS = [
            ['Red', '#dc2626'], ['Orange', '#ea580c'], ['Amber', '#d97706'], ['Green', '#16a34a'],
            ['Blue', '#2563eb'], ['Violet', '#7c3aed']
        ];
        var PAGE_COLORS = [
            ['Cream', '#fbf3df'], ['Rose', '#fbe4e2'], ['Butter', '#fdf2c4'], ['Mint', '#dff3e4'],
            ['Sky', '#ddeefb'], ['Lavender', '#ece6fa']
        ];
        var THEMES = [
            { id: 'blank', name: 'Blank Page', chips: ['#f2f0ef', '#c9c8c7', '#949392', '#66615e'] },
            { id: 'spring', name: 'Spring', chips: ['#ccdcdb', '#a1d8b5', '#4cb572', '#135e4b'] },
            { id: 'cascade', name: 'Cascade', chips: ['#e8edf2', '#8ca4bb', '#6a89a7', '#516e89'] },
            { id: 'driftwood', name: 'Driftwood', chips: ['#cccdc7', '#e4a499', '#bc7b6f', '#5a322a'] },
            { id: 'rose', name: 'Rose', chips: ['#dfd9d8', '#fc8f8f', '#b44446', '#64242f'] },
            { id: 'walnut', name: 'Walnut', chips: ['#4a413c', '#bb6c43', '#c8906d', '#ccb499'] },
            { id: 'forest', name: 'Forest', chips: ['#1b1b1b', '#1c4c2d', '#429155', '#b69ad2'] }
        ];
        var DEFAULT_THEME = 'blank';
        var currentTheme = DEFAULT_THEME;

        function applyTheme(id) {
            var known = THEMES.some(function(t) { return t.id === id; });
            currentTheme = known ? id : DEFAULT_THEME;
            if (currentTheme === DEFAULT_THEME) {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', currentTheme);
            }
        }

        var MOBILE_QUERY = window.matchMedia('(max-width: 720px)');

        function changeFavicon(url) {
            var link = document.createElement('link'),
                oldLink = document.querySelector('link[rel="shortcut icon"]') || document.querySelector('link[rel="icon"]');
            link.rel = 'shortcut icon';
            link.href = url;

            if (oldLink) {
                document.head.removeChild(oldLink);
            }
            document.head.appendChild(link);
        }

        function createIconButton(iconPaths, label) {
            var button = document.createElement('button');
            button.type = 'button';
            button.className = 'icon-btn';
            button.title = label;
            button.setAttribute('aria-label', label);
            button.appendChild(createIcon(iconPaths));
            return button;
        }

        function createTextButton(iconPaths, label, hint) {
            var button = document.createElement('button');
            button.type = 'button';
            button.className = 'text-btn';
            if (hint) button.title = hint;
            button.appendChild(createIcon(iconPaths));
            button.appendChild(document.createTextNode(label));
            return button;
        }

        function savePaneContent() {
            var allPanes = entryContent.querySelectorAll('.entry-pane');
            allPanes.forEach(pane => {
                var entryId = pane.dataset.entryId;
                var contentDiv = pane.querySelector('div[contenteditable="true"]');
                if (contentDiv && entryId !== undefined) {
                    var entryIndex = entries.findIndex(entry => entry.id.toString() === entryId);
                    if (entryIndex !== -1) {
                        var clone = contentDiv.cloneNode(true);
                        clone.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                            var textNode = document.createTextNode(checkbox.checked ? '[x]' : '[ ]');
                            checkbox.parentNode.replaceChild(textNode, checkbox);
                        });
                        entries[entryIndex].content = clone.innerHTML;
                        updateEntryPreview(entries[entryIndex]);
                    }
                }
            });
            saveEntries();
        }

        function saveEntries() {
            entryContentStorage.value = JSON.stringify(entries);
            persistEntries();
        }

        var HASH_PREFIX = 'n1.';
        var WINDOW_NAME_PREFIX = 'text-bookmarklet:';
        var HASH_PERSIST_DELAY = 500;
        var hashPersistTimer = null;

        function bytesToBase64Url(bytes) {
            var binary = '';
            for (var i = 0; i < bytes.length; i += 0x8000) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
            }
            return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        function base64UrlToBytes(str) {
            var binary = atob(str.replace(/-/g, '+').replace(/_/g, '/'));
            var bytes = new Uint8Array(binary.length);
            for (var i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes;
        }

        function compressText(text) {
            var stream = new Blob([text]).stream().pipeThrough(new CompressionStream('deflate-raw'));
            return new Response(stream).arrayBuffer().then(function(buffer) {
                return bytesToBase64Url(new Uint8Array(buffer));
            });
        }

        function decompressText(encoded) {
            var stream = new Blob([base64UrlToBytes(encoded)]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
            return new Response(stream).text();
        }

        function persistEntries() {
            var snapshot = JSON.stringify({ savedAt: Date.now(), entries: entries, theme: currentTheme });
            try {
                window.name = WINDOW_NAME_PREFIX + snapshot;
            } catch (e) {
                console.error('Error saving notes to window.name:', e);
            }
            clearTimeout(hashPersistTimer);
            hashPersistTimer = setTimeout(function() {
                compressText(snapshot).then(function(encoded) {
                    history.replaceState(null, '', location.href.split('#')[0] + '#' + HASH_PREFIX + encoded);
                }).catch(function(e) {
                    console.error('Error saving notes to the URL:', e);
                });
            }, HASH_PERSIST_DELAY);
        }

        function parseSnapshot(json) {
            var snapshot = JSON.parse(json);
            return snapshot && Array.isArray(snapshot.entries) ? snapshot : null;
        }

        function restorePersistedEntries() {
            var fromWindowName = null;
            if (window.name.indexOf(WINDOW_NAME_PREFIX) === 0) {
                try {
                    fromWindowName = parseSnapshot(window.name.slice(WINDOW_NAME_PREFIX.length));
                } catch (e) {
                    console.error('Error reading notes from window.name:', e);
                }
            }
            var hash = location.hash.slice(1);
            var fromHash = hash.indexOf(HASH_PREFIX) === 0
                ? decompressText(hash.slice(HASH_PREFIX.length)).then(parseSnapshot).catch(function(e) {
                    console.error('Error reading notes from the URL:', e);
                    return null;
                })
                : Promise.resolve(null);
            return fromHash.then(function(hashSnapshot) {
                var newest = [hashSnapshot, fromWindowName].filter(Boolean).sort(function(a, b) {
                    return b.savedAt - a.savedAt;
                })[0];
                if (newest && newest.theme) applyTheme(newest.theme);
                return newest ? JSON.stringify(newest.entries) : '';
            });
        }

        function loadEntries() {
            var storedEntries = entryContentStorage.value;
            if (!storedEntries) {
                entries = [];
                var defaultEntry = addNewEntry("Notes");
                current = 0;
                updateEntryList();
                clearAndLoadEntry(defaultEntry);
                return;
            }
            try {
                entries = JSON.parse(storedEntries);
                nextEntryId = entries.reduce(function(max, entry) { return Math.max(max, entry.id); }, -1) + 1;
                current = entries.length > 0 ? 0 : -1;
                updateEntryList();
                updateEntryContent();
            } catch (e) {
                console.error('Error parsing entries:', e);
            }
        }

        function ensureDivWrapper(contentEditableDiv) {
            var htmlContent = contentEditableDiv.innerHTML.trim();
            if (htmlContent === "" || htmlContent === "<br>") {
                contentEditableDiv.innerHTML = "<div><br></div>";
            }
        }

        function addNewEntry(title) {
            var newEntry = {
                id: nextEntryId++,
                title: title,
                content: "",
                titleBarColor: DEFAULT_COLOR,
                contentBackgroundColor: DEFAULT_COLOR
            };
            entries.push(newEntry);
            saveEntries();
            return newEntry;
        }

        function reorderEntries(sourceIndex, targetIndex) {
            if (isNaN(sourceIndex) || sourceIndex === targetIndex) return;
            var currentEntry = entries[current];
            const movedItem = entries.splice(sourceIndex, 1)[0];
            entries.splice(targetIndex, 0, movedItem);
            current = entries.indexOf(currentEntry);
            updateEntryList();
            saveEntries();
        }

        function getContentPreview(html) {
            if (!html) return '';
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            tempDiv.querySelectorAll('div, p, li, br').forEach(function(el) {
                el.before(' ');
            });
            var text = (tempDiv.textContent || '').replace(/\[[ x]\]/g, '').replace(/\s+/g, ' ').trim();
            if (!text) return '';
            return text.length > 80 ? text.slice(0, 80) + '\u2026' : text;
        }

        function updateEntryPreview(entry) {
            var idx = entries.indexOf(entry);
            if (idx === -1) return;
            var row = entryList.querySelector('.entry-item[data-index="' + idx + '"]');
            if (!row) return;
            var previewEl = row.querySelector('.entry-item-preview');
            if (previewEl) previewEl.textContent = getContentPreview(entry.content) || 'Empty note';
        }

        function isDefaultColor(color) {
            return !color || color.toLowerCase() === DEFAULT_COLOR;
        }

        function applyColorDotStyle(dotEl, color) {
            if (isDefaultColor(color)) {
                dotEl.style.removeProperty('--dot');
                dotEl.classList.add('color-dot-empty');
            } else {
                dotEl.style.setProperty('--dot', color);
                dotEl.classList.remove('color-dot-empty');
            }
        }

        function applyPageColor(pane, color) {
            if (isDefaultColor(color)) {
                pane.style.backgroundColor = '';
                pane.style.color = '';
                pane.classList.remove('has-page-color');
            } else {
                pane.style.backgroundColor = color;
                pane.style.color = isColorLight(color) ? '#1d1b18' : '#f3efe9';
                pane.classList.add('has-page-color');
            }
        }

        function syncEntryColorUI(entry) {
            var idx = entries.indexOf(entry);
            if (idx !== -1) {
                var sidebarDot = entryList.querySelector('.entry-item[data-index="' + idx + '"] .color-dot');
                if (sidebarDot) applyColorDotStyle(sidebarDot, entry.titleBarColor);
            }
            document.querySelectorAll('.entry-pane[data-entry-id="' + entry.id + '"]').forEach(function(pane) {
                var titleDot = pane.querySelector('.pane-color-dot');
                if (titleDot) applyColorDotStyle(titleDot, entry.titleBarColor);
                applyPageColor(pane, entry.contentBackgroundColor);
            });
        }

        function attachInlineRename(entry, spanEl, inputEl, draggableToggleEl, onAfterCommit, trigger) {
            function enterEditMode(event) {
                if (event) event.stopPropagation();
                inputEl.value = entry.title;
                spanEl.style.display = 'none';
                inputEl.style.display = '';
                if (draggableToggleEl) draggableToggleEl.draggable = false;
                inputEl.focus();
                inputEl.select();
            }
            function exitEditMode() {
                var newTitle = inputEl.value.trim();
                if (newTitle && newTitle !== entry.title) {
                    entry.title = newTitle;
                    saveEntries();
                }
                spanEl.textContent = entry.title;
                inputEl.style.display = 'none';
                spanEl.style.display = '';
                if (draggableToggleEl) draggableToggleEl.draggable = true;
                if (onAfterCommit) onAfterCommit();
            }
            spanEl.addEventListener(trigger || 'dblclick', enterEditMode);
            spanEl._rename = enterEditMode;
            inputEl.addEventListener('blur', exitEditMode);
            inputEl.addEventListener('click', function(e) { e.stopPropagation(); });
            inputEl.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    inputEl.blur();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    e.stopPropagation();
                    inputEl.value = entry.title;
                    inputEl.blur();
                }
            });
            return { enter: enterEditMode };
        }

        function openEntry(index) {
            current = index;
            entryList.querySelectorAll('.entry-item').forEach(function(item) {
                item.classList.toggle('active', item.getAttribute('data-index') === String(index));
            });
            clearAndLoadEntry(entries[index]);
            closeDrawer();
        }

        function updateEntryList() {
            var entryListContainer = document.createElement("div");
            noteCount.textContent = entries.length;
            entries.forEach(function(entry, index) {
                var e = document.createElement("div");
                e.className = "entry-item";
                e.setAttribute('data-index', index.toString());
                e.draggable = true;

                e.ondragstart = function(event) {
                    event.dataTransfer.setData("text/index", index.toString());
                    event.dataTransfer.setData("entry-index", index.toString());
                    e.classList.add('dragging');
                };
                e.ondragend = function() {
                    e.classList.remove('dragging');
                    entryContent.classList.remove('drop-target');
                };
                e.ondragover = function(event) {
                    if (event.dataTransfer.types.indexOf('text/index') === -1) return;
                    event.preventDefault();
                    e.classList.add('drag-over');
                };
                e.ondragleave = function() {
                    e.classList.remove('drag-over');
                };
                e.ondrop = function(event) {
                    event.preventDefault();
                    e.classList.remove('drag-over');
                    reorderEntries(parseInt(event.dataTransfer.getData("text/index")), index);
                };

                var colorDot = document.createElement("button");
                colorDot.type = "button";
                colorDot.className = "color-dot";
                colorDot.title = "Note colors";
                colorDot.setAttribute('aria-label', 'Colors for ' + entry.title);
                applyColorDotStyle(colorDot, entry.titleBarColor);
                colorDot.onclick = function(event) {
                    event.stopPropagation();
                    showColorPopover(entry, colorDot);
                };
                e.appendChild(colorDot);

                var textWrap = document.createElement("div");
                textWrap.className = "entry-item-text";

                var titleSpan = document.createElement("span");
                titleSpan.className = "entry-item-title";
                titleSpan.title = "Double-click to rename";
                titleSpan.textContent = entry.title;

                var titleInput = document.createElement("input");
                titleInput.type = "text";
                titleInput.className = "entry-item-title-input";
                titleInput.setAttribute('aria-label', 'Note title');
                titleInput.style.display = "none";

                attachInlineRename(entry, titleSpan, titleInput, e, function() {
                    document.querySelectorAll('.entry-pane[data-entry-id="' + entry.id + '"] .pane-title-text').forEach(function(el) {
                        el.textContent = entry.title;
                    });
                });

                textWrap.appendChild(titleSpan);
                textWrap.appendChild(titleInput);

                var previewSpan = document.createElement("span");
                previewSpan.className = "entry-item-preview";
                previewSpan.textContent = getContentPreview(entry.content) || 'Empty note';
                textWrap.appendChild(previewSpan);

                e.appendChild(textWrap);

                var deleteBtn = createIconButton(ICONS.trash, "Delete note");
                deleteBtn.className += " delete-btn";
                deleteBtn.onclick = function(event) {
                    event.stopPropagation();
                    showModal('Delete \u201c' + entry.title + '\u201d?', 'This can\u2019t be undone.', function() {
                        entries.splice(index, 1);
                        if (current === index) {
                            current = entries.length ? Math.min(index, entries.length - 1) : -1;
                        } else if (current > index) {
                            current -= 1;
                        }
                        updateEntryList();
                        updateEntryContent();
                        saveEntries();
                    });
                };
                e.appendChild(deleteBtn);

                if (index === current) {
                    e.classList.add("active");
                }

                e.onclick = function(event) {
                    if (event.detail > 1) return;
                    openEntry(index);
                };

                entryListContainer.appendChild(e);
            });
            entryList.innerHTML = '';
            entryList.appendChild(entryListContainer);
        }

        function isColorLight(color) {
            if (color.startsWith('#')) {
                color = color.substring(1);
            }
            var r = parseInt(color.substr(0, 2), 16);
            var g = parseInt(color.substr(2, 2), 16);
            var b = parseInt(color.substr(4, 2), 16);
            var yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            return yiq >= 128;
        }

        var openPopover = null;

        function closePopover(refocus) {
            if (!openPopover) return;
            var p = openPopover;
            openPopover = null;
            p.el.remove();
            document.removeEventListener('mousedown', p.onOutside, true);
            document.removeEventListener('keydown', p.onKey, true);
            if (refocus && document.body.contains(p.anchor)) p.anchor.focus();
        }

        function showColorPopover(entry, anchor) {
            var reopen = openPopover && openPopover.anchor === anchor;
            closePopover();
            if (reopen) return;

            var pop = document.createElement('div');
            pop.className = 'popover';
            pop.setAttribute('role', 'dialog');
            pop.setAttribute('aria-label', 'Colors for ' + entry.title);

            function section(label, key, palette) {
                var wrap = document.createElement('div');
                wrap.className = 'popover-section';
                var heading = document.createElement('span');
                heading.className = 'popover-label';
                heading.textContent = label;
                wrap.appendChild(heading);
                var grid = document.createElement('div');
                grid.className = 'swatches';

                function choose(color) {
                    entry[key] = color;
                    saveEntries();
                    syncEntryColorUI(entry);
                    grid.querySelectorAll('.swatch').forEach(function(s) {
                        s.setAttribute('aria-pressed', String(s.dataset.color === color.toLowerCase()));
                    });
                }

                function addSwatch(name, color, extraClass) {
                    var b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'swatch' + (extraClass ? ' ' + extraClass : '');
                    b.title = name;
                    b.setAttribute('aria-label', name);
                    b.dataset.color = color;
                    b.style.setProperty('--swatch', color);
                    b.setAttribute('aria-pressed', String((entry[key] || DEFAULT_COLOR).toLowerCase() === color));
                    b.onclick = function() { choose(color); };
                    grid.appendChild(b);
                    return b;
                }

                addSwatch('None', DEFAULT_COLOR, 'swatch-none');
                palette.forEach(function(c) { addSwatch(c[0], c[1]); });

                var custom = document.createElement('label');
                custom.className = 'swatch swatch-custom';
                custom.title = 'Custom color';
                var input = document.createElement('input');
                input.type = 'color';
                input.setAttribute('aria-label', label + ': custom color');
                input.value = isDefaultColor(entry[key]) ? (key === 'titleBarColor' ? '#b4441c' : '#fbf3df') : entry[key];
                input.oninput = function() { choose(input.value); };
                custom.appendChild(input);
                grid.appendChild(custom);

                wrap.appendChild(grid);
                return wrap;
            }

            pop.appendChild(section('Label', 'titleBarColor', LABEL_COLORS));
            pop.appendChild(section('Page', 'contentBackgroundColor', PAGE_COLORS));
            presentPopover(pop, anchor, '.swatch[aria-pressed="true"]');
        }

        function presentPopover(pop, anchor, focusSelector) {
            document.body.appendChild(pop);

            var r = anchor.getBoundingClientRect();
            var w = pop.offsetWidth, h = pop.offsetHeight;
            var left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
            var top = r.bottom + 6;
            if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
            pop.style.left = left + 'px';
            pop.style.top = top + 'px';

            var state = {
                el: pop,
                anchor: anchor,
                onOutside: function(ev) {
                    if (!pop.contains(ev.target) && !anchor.contains(ev.target)) closePopover();
                },
                onKey: function(ev) {
                    if (ev.key === 'Escape') {
                        ev.stopPropagation();
                        closePopover(true);
                    }
                }
            };
            openPopover = state;
            document.addEventListener('mousedown', state.onOutside, true);
            document.addEventListener('keydown', state.onKey, true);
            var selected = pop.querySelector(focusSelector) || pop.querySelector('button');

        var BULLET = '\u2022';
        var pendingListKind = null;

        function placeCaret(node, offset) {
            var range = document.createRange();
            range.setStart(node, offset);
            range.collapse(true);
            var sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        }

        function getCaretLine(editable) {
            var sel = window.getSelection();
            if (!sel.rangeCount) return null;
            var node = sel.anchorNode;
            if (!node || node === editable || !editable.contains(node)) return null;
            while (node.parentNode !== editable) node = node.parentNode;
            return node.nodeType === Node.ELEMENT_NODE ? node : null;
        }

        function lineKind(line) {
            var first = line.firstChild;
            if (!first) return null;
            if (first.nodeName === 'INPUT' && first.type === 'checkbox') return 'check';
            if (first.nodeType === Node.TEXT_NODE && /^\u2022[ \u00a0]/.test(first.data)) return 'bullet';
            return null;
        }

        function lineIsEmptyItem(line, kind) {
            var text = kind === 'bullet' ? line.textContent.slice(2) : line.textContent;
            return !text.replace(/[\s\u00a0]/g, '');
        }

        function autoFormatLine(editable) {
            var line = getCaretLine(editable);
            if (!line) return;
            var first = line.firstChild;
            var sel = window.getSelection();
            if (first && lineKind(line) === 'check' && first.nextSibling && first.nextSibling.nodeType === Node.TEXT_NODE) {
                var after = first.nextSibling;
                var mark = after.data.match(/^[ \u00a0]*\[([ \u00a0xX])\][ \u00a0]/);
                if (mark) {
                    var offset = sel.anchorNode === after ? sel.anchorOffset : after.data.length;
                    first.checked = mark[1] === 'x' || mark[1] === 'X';
                    after.data = '\u00a0' + after.data.slice(mark[0].length);
                    placeCaret(after, Math.max(1, offset - mark[0].length + 1));
                }
                return;
            }
            if (!first || first.nodeType !== Node.TEXT_NODE) return;
            var caret = sel.anchorNode === first ? sel.anchorOffset : first.data.length;
            var box = first.data.match(/^\[([ \u00a0xX])\][ \u00a0]/);
            if (box) {
                var checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = box[1] === 'x' || box[1] === 'X';
                first.data = '\u00a0' + first.data.slice(4);
                line.insertBefore(checkbox, first);
                placeCaret(first, Math.max(1, caret - 3));
            } else if (/^[*-][ \u00a0]/.test(first.data)) {
                first.data = BULLET + '\u00a0' + first.data.slice(2);
                placeCaret(first, Math.min(caret, first.data.length));
            }
        }

        function continueList(editable, kind) {
            var line = getCaretLine(editable);
            if (!line || lineKind(line)) return;
            if (line.childNodes.length === 1 && line.firstChild.nodeName === 'BR') {
                line.removeChild(line.firstChild);
            }
            var first = line.firstChild;
            if (kind === 'check') {
                var checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                var space;
                if (first && first.nodeType === Node.TEXT_NODE) {
                    first.data = '\u00a0' + first.data;
                    space = first;
                } else {
                    space = document.createTextNode('\u00a0');
                    line.insertBefore(space, first);
                }
                line.insertBefore(checkbox, space);
                placeCaret(space, 1);
            } else {
                var marker;
                if (first && first.nodeType === Node.TEXT_NODE) {
                    first.data = BULLET + '\u00a0' + first.data;
                    marker = first;
                } else {
                    marker = document.createTextNode(BULLET + '\u00a0');
                    line.insertBefore(marker, first);
                }
                placeCaret(marker, 2);
            }
        }

                e.preventDefault();
                toggleSidebar();
            } else if (e.key === 'Escape' && document.body.classList.contains('drawer-open')) {
                closeDrawer();
            }
        });

        entryContent.addEventListener('keydown', function(e) {
            if (e.target.closest && !e.target.closest('.content-editable')) return;
            if (e.ctrlKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
                var selection = window.getSelection();
                if (selection.rangeCount === 0) return;
                var range = selection.getRangeAt(0);
                var currentNode = range.startContainer;
                var currentElement = currentNode.nodeType === Node.ELEMENT_NODE ? currentNode : currentNode.parentElement;
                var isCheckboxLine = currentElement.nodeName === "INPUT" || (currentElement.nodeName === "DIV" && currentElement.querySelector('input[type="checkbox"]'));
                if (!isCheckboxLine) return;
                var currentDiv = currentElement.nodeName === "INPUT" ? currentElement : currentElement.closest('div');
                var siblingDiv = e.key === "ArrowUp" ? currentDiv.previousElementSibling : currentDiv.nextElementSibling;
                if (siblingDiv && (siblingDiv.querySelector('input[type="checkbox"]') || siblingDiv.nodeName === "INPUT")) {
                    e.preventDefault();
                    var movedDiv = moveCheckboxLine(currentDiv, siblingDiv, e.key);
                    setCursorToEnd(movedDiv);
                }
            }
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                pendingListKind = null;
                var editable = e.target.closest('.content-editable');
                var line = editable && getCaretLine(editable);
                var kind = line && lineKind(line);
                if (kind) {
                    if (lineIsEmptyItem(line, kind)) {
                        e.preventDefault();
                        line.innerHTML = '<br>';
                        placeCaret(line, 0);
                        savePaneContent();
                    } else {
                        pendingListKind = kind;
                    }
                }
            }
            if (e.key === 'Tab') {
                e.preventDefault();
                document.execCommand('insertHTML', false, '&nbsp;&nbsp;&nbsp;&nbsp;');
            }
        });

        document.execCommand('defaultParagraphSeparator', false, 'div');

        document.addEventListener('DOMContentLoaded', function() {
            restorePersistedEntries().then(function(storedEntries) {
                entryContentStorage.value = storedEntries;
                loadEntries();
                lastSavedEntries = JSON.stringify(entries);
            });
        });

    </script>
</body>
</html>
